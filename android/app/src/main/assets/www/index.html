let FILTRO={tipo:"tudo",q:"",fixo:false,inst:null};
let EXT_MODO="conta";
let CATS_ABERTAS=false;

function viewExtrato(){
  const p=periodo(OFFSET);
  const insts=instituicoes();
  if(FILTRO.inst&&!insts.some(b=>b.nome===FILTRO.inst)) FILTRO.inst=null;
  const B=FILTRO.inst;
  const noBanco=t=>txDaInst(t,B);
  const sai=r2(vivas().filter(t=>t.tipo==="despesa"&&dentro(t.data,p)&&noBanco(t)).reduce((a,t)=>a+t.valor,0));
  const ent=r2(vivas().filter(t=>t.tipo==="receita"&&dentro(t.data,p)&&noBanco(t)).reduce((a,t)=>a+t.valor,0));
  const cats=distinguir(dobrar(gastosPorCategoria(p,B),7));
  const hj=new Date(); hj.setHours(0,0,0,0);
  const fechado=p.fim<hj;

  let h=`<div class="exhead">
    <button class="volta" data-volta aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="flex:1;min-width:0">
      <div class="per">${esc(p.sub)} · ${fechado?"mês fechado":p.ini>hj?"mês futuro":"mês atual"}${B?" · "+esc(B.toUpperCase()):""}</div>
      <h1>Extrato de ${esc(MESES[p.ini.getMonth()])}</h1>
    </div>
  </div>`;
  if(OFFSET!==0) h+=`<div style="padding:0 20px 6px">
    <button class="agora" data-agora>Ir para ${esc(MESES[periodo(0).ini.getMonth()])}, o mês atual ›</button></div>`;

  if(insts.length>1){
    h+=`<div class="chips2" style="padding-bottom:10px">
      <button data-finst="" aria-pressed="${!B}">Todos os bancos</button>
      ${insts.map(b=>`<button data-finst="${esc(b.nome)}" aria-pressed="${B===b.nome}">${esc(b.nome)}</button>`).join("")}
    </div>`;
  }

  /* donut + lista de categorias */
  const ehCartao=t=>conta(t.contaId)?.tipo==="cartao";
  const noCartao=r2(vivas().filter(t=>t.tipo==="despesa"&&dentro(t.data,p)&&noBanco(t)&&ehCartao(t)).reduce((a,t)=>a+t.valor,0));
  const split={conta:r2(sai-noCartao),cartao:noCartao};
  h+=`<div class="donutcard">${donutGastos(cats,sai,ent,split)}`;
  if(cats.length){
    const visiveis=CATS_ABERTAS?cats:cats.slice(0,3);
    h+=`<div class="catlist">`;
    visiveis.forEach(c=>{
      const pc=sai>0?Math.round(c.valor/sai*100):0;
      const teto=c.id?tetoDe(c.id,p.ref):0;
      const over=teto>0&&c.valor>teto;
      h+=`<div class="catrow${over?" over":""}"><i class="sw" style="background:${over?"var(--warn)":c.cor}"></i>
        <span class="cn">${esc(c.nome)}${c.resto?` (${c.resto})`:""}</span>
        <span class="cv num">${money(c.valor)}</span><span class="cp num">${pc}%</span></div>`;
    });
    if(cats.length>3) h+=`<button class="catmore" data-togglecats>${CATS_ABERTAS?"MOSTRAR MENOS ⌃":"VER AS "+cats.length+" CATEGORIAS ⌄"}</button>`;
    h+=`</div>`;
    if(noCartao>0) h+=`<div class="anelnota">Anel interno: <b class="c1">conta ${Math.round(split.conta/sai*100)}%</b> · <b class="c2">cartão ${Math.round(noCartao/sai*100)}%</b></div>`;
  }else{
    h+=`<div class="tiny" style="text-align:center;margin-top:16px">Nenhuma despesa neste mês.</div>`;
  }
  h+=`</div>`;

  /* três indicadores */
  const desps=vivas().filter(t=>t.tipo==="despesa"&&dentro(t.data,p)&&noBanco(t));
  const diasCorridos=Math.max(1,Math.min(
    Math.round((Math.min(hj,p.fim)-p.ini)/86400000)+1,
    Math.round((p.fim-p.ini)/86400000)+1));
  const maior=desps.slice().sort((a,b)=>b.valor-a.valor)[0];
  const fixos=r2(vivas().filter(t=>t.tipo==="despesa"&&t.recorrenciaId&&dentro(t.data,p)&&noBanco(t))
    .reduce((a,t)=>a+t.valor,0));
  h+=`<div class="tiles3">
    <div class="tile3"><div class="k">MÉDIA<br>POR DIA</div><div class="v num">R$ ${eixo(r2(sai/diasCorridos))}</div></div>
    <div class="tile3"><div class="k">MAIOR<br>GASTO</div><div class="v">${maior?esc(maior.descricao||cat(maior.categoriaId)?.nome||"—"):"—"}</div></div>
    <div class="tile3"><div class="k">GASTOS<br>FIXOS</div><div class="v num">R$ ${eixo(fixos)}</div></div>
  </div>`;

  /* o que ainda é expectativa */
  const pv=previstosPeriodo(p,B);
  if(pv.n){
    h+=`<div class="prevbar">
      <div class="pb1"><b>${pv.n} ${pv.n===1?"lançamento previsto":"lançamentos previstos"}</b>
        <span>${pv.sai>0?"−"+money(pv.sai):""}${pv.sai>0&&pv.entra>0?" · ":""}${pv.entra>0?"+"+money(pv.entra):""}</span></div>
      <div class="pb2">São expectativas suas, não confirmações do banco. Toque no ✓ de cada um quando acontecer.</div>
    </div>`;
  }

  /* Conta | Cartão: escolhe qual extrato aparece embaixo. O gráfico acima não muda. */
  const cs=cartoes().filter(c=>!B||contaNaInst(c.id,B));
  if(!cs.length) EXT_MODO="conta";
  const hojeNoPer=dentro(hoje(),p);
  const refPer=c=>faturaDe(c,hojeNoPer?hoje():iso(p.ini));
  const faturas=cs.map(c=>{ const ref=refPer(c), tot=faturaTotal(c.id,ref), pg=faturaPago(c.id,ref);
    const [y,m]=ref.split("-").map(Number), fech=new Date(y,m-1,clamp(c.diaFechamento||1,1,28));
    return {c,ref,tot,pg,rest:r2(tot-pg),venc:vencimentoFatura(c,ref),fech,
      status:tot>0&&r2(tot-pg)<=0?"PAGA":hj>fech?"FECHADA":"ABERTA"}; });
  if(cs.length){
    const saldoB=r2(contasPag().filter(c=>contaNaInst(c.id,B)).reduce((a,c)=>a+saldo(c.id),0));
    const aberto=r2(faturas.reduce((a,f)=>a+f.rest,0));
    const lim=cs.reduce((a,c)=>a+(c.limite||0),0), uso=r2(cs.reduce((a,c)=>a+usoCartao(c.id),0));
    h+=`<div class="sh"><h2>Extrato</h2></div><div class="exsel">
      <button class="orctile f-conta" data-exmodo="conta" aria-pressed="${EXT_MODO==="conta"}">
        <span class="k"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M19 10v8M3 20h18"/></svg>CONTA</span>
        <span class="v num${saldoB<0?" neg":""}">${money(saldoB)}</span>
        <span class="d">saldo agora</span></button>
      <button class="orctile f-credito" data-exmodo="cartao" aria-pressed="${EXT_MODO==="cartao"}">
        <span class="k"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>CARTÃO</span>
        <span class="v num">${money(aberto)}</span>
        ${lim>0?`<span class="track" style="display:block"><i style="width:${clamp(uso/lim*100,0,100)}%;background:${uso/lim>.8?"var(--warn)":"var(--fc)"}"></i></span>`:""}
        <span class="d">${faturas.length===1?"fatura vence "+fmtData(faturas[0].venc).slice(0,5):faturas.length+" cartões"}</span></button>
    </div>`;
  }
  const modoCartao=EXT_MODO==="cartao";

  if(modoCartao){
    faturas.forEach(f=>{ const lim=f.c.limite||0, uso=usoCartao(f.c.id), pg=contaPagadora(f.c);
      h+=`<div class="fatcard">
        <div class="f1"><span>FATURA DE ${esc(MESES[+f.ref.split("-")[1]-1].toUpperCase())} · ${f.status}</span><span>fecha ${fmtData(iso(f.fech)).slice(0,5)}</span></div>
        <div class="f2"><div><div class="fv num">${money(f.rest)}</div>
          <div class="fs">${cs.length>1?esc(f.c.nome)+" · ":""}vence ${fmtData(f.venc).slice(0,5)}${pg?" · sai da "+esc(pg.nome):""}${f.pg>0?" · "+money(f.pg)+" já pago":""}</div></div>
          ${f.rest>0?`<button class="fpagar" data-pagar="${f.c.id}" data-ref="${f.ref}">Pagar</button>`:""}</div>
        ${lim>0?`<div class="track" style="margin-top:14px"><i style="width:${clamp(uso/lim*100,0,100)}%;background:${uso/lim>.8?"var(--warn)":"var(--cred)"}"></i></div>
          <div class="pct2"><span>${Math.round(uso/lim*100)}% do limite de ${money(lim)}</span><span>${money(Math.max(0,r2(lim-uso)))} livre</span></div>`:""}
      </div>`; });
  }

  /* lançamentos do modo escolhido */
  let ts=vivas().filter(t=>dentro(t.data,p)&&noBanco(t)&&(modoCartao?(t.tipo==="despesa"&&ehCartao(t)):!(t.tipo==="despesa"&&ehCartao(t))));
  const F=FILTRO;
  if(F.tipo==="credito"||F.tipo==="debito"||modoCartao) F.tipo="tudo";
  if(F.tipo!=="tudo"){
    if(F.tipo==="transf") ts=ts.filter(t=>t.tipo==="transferencia"||t.tipo==="pagfatura");
    else ts=ts.filter(t=>t.tipo===F.tipo);
  }
  if(F.fixo) ts=ts.filter(t=>!!t.recorrenciaId);
  if(F.q){const q=F.q.toLowerCase();
    ts=ts.filter(t=>(t.descricao||"").toLowerCase().includes(q)||(cat(t.categoriaId)?.nome||"").toLowerCase().includes(q));}
  ts.sort((a,b)=>b.data.localeCompare(a.data)||b.id.localeCompare(a.id));

  h+=`<div class="sh"${cs.length?' style="padding-top:18px"':""}><h2 style="font-size:.98rem">${modoCartao?"Compras no cartão":"Movimentos da conta"}</h2>
    <span class="act" style="color:var(--ink-faint)">${ts.length} ${ts.length===1?"LANÇAMENTO":"LANÇAMENTOS"}</span></div>`;
  if(!modoCartao) h+=`<div class="tiny" style="margin:-4px 22px 0;text-align:right">à direita de cada dia: o saldo da conta ao fim dele</div>`;
  const chips=modoCartao?[]:[["tudo","Tudo"],["despesa","Despesas"],["receita","Receitas"],["transf","Transf."]];
  h+=`<div class="chips2">
    ${chips.map(([id,l])=>`<button data-ft="${id}" aria-pressed="${!F.fixo&&F.tipo===id}">${l}</button>`).join("")}

    return h;
  }

  const grupos=[];
  ts.forEach(t=>{
    let g=grupos[grupos.length-1];

    g.itens.push(t);
    if(t.tipo==="receita") g.soma+=t.valor;
    else if(t.tipo==="despesa"||t.tipo==="pagfatura") g.soma-=t.valor;
  });
  h+=`<div class="daygroups${modoCartao?" cart":""}">`;
  grupos.forEach(g=>{
    const s0=r2(g.soma);
    h+=`<div><div class="dayhead"><span class="d">${esc(fmtDia(g.data))}</span>
      <span class="dt">${modoCartao?`<span class="sal num" style="color:var(--cred-ink)">${money(Math.abs(s0))}</span><span class="mov">no cartão</span>`
        :`<span class="sal num ${saldoAte(g.data,B)<0?"neg":""}">${money(saldoAte(g.data,B))}</span>
        <span class="mov num">${s0<0?"−":"+"}${money(Math.abs(s0))} no dia</span>`}</span></div>
      <div class="txcard">${g.itens.map(txRow).join("")}</div></div>`;
  });
  h+=`</div>`;
  return h;
}

function txRow(t){
  const c=cat(t.categoriaId), ac=conta(t.contaId);
  let titulo, sub, cor;
  if(t.tipo==="transferencia"){
    titulo=t.descricao||"Transferência";
    sub="Transferência · "+(conta(t.contaId)?.nome||"?")+" → "+(conta(t.contaDestinoId)?.nome||"?");
    cor="var(--info)";
  }else if(t.tipo==="pagfatura"){
    titulo=t.descricao||"Pagamento de fatura";
    sub="Fatura · "+(conta(t.cartaoId)?.nome||"cartão")+" · "+(ac?.nome||"");
    cor="var(--info)";
  }else{
    titulo=t.descricao||(c?c.nome:"Sem categoria");
    sub=(c?c.nome:"Sem categoria")+" · "+(ac?ac.nome:"")+(t.tipo==="despesa"&&formaDe(t)==="credito"?" · crédito":"");
    cor=t.tipo==="receita"?"var(--accent-ink)":"var(--ink)";
  }
  if(t.parcelaTotal>1) sub+=" · "+t.parcelaAtual+"/"+t.parcelaTotal;
  const prev=ehPrevisto(t);
  const sinal=t.tipo==="receita"?"+":"−";
  return `<div class="txrow${prev?" prev":""}">
    <button class="txmain" data-tx="${t.id}">
      <span class="av">${esc(iniciais(titulo))}</span>
      <span class="mid">
        <span class="l1"><span class="tt">${esc(titulo)}</span>
          ${t.recorrenciaId?`<span class="fixotag">FIXO</span>`:""}
          ${prev?`<span class="fixotag prevtag">PREVISTO</span>`:""}
        </span>
        <span class="sb">${esc(sub)}</span>
      </span>
      <span class="vl num" style="color:${cor}">${sinal}${money(t.valor).replace("R$","").trim()}</span>
    </button>
    ${prev?`<button class="okbtn" data-confirmar="${t.id}" title="Marcar como realizado" aria-label="Confirmar ${esc(titulo)}">
      <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></button>`:""}
  </div>`;
}

/* ---------- PLANO: orçamento e metas ---------- */
/* Orçamento unificado: cada teto é de uma categoria e vale para uma forma de
   pagamento — qualquer, só crédito ou só débito/Pix. No topo, um resumo por
   forma (que também filtra); abaixo, os tetos agrupados por forma. */
const FORMAS=[
  {id:"credito",nome:"Crédito",grupo:"SÓ NO CRÉDITO",titulo:"Só no crédito",
    desc:"Só compras no cartão, pela data da compra. Cada parcela conta no seu mês.",
    svg:`<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>`},
  {id:"debito",nome:"Débito·Pix",grupo:"SÓ NO DÉBITO · PIX",titulo:"Só no débito · Pix",
    desc:"Só o que sai direto da conta: débito, Pix e dinheiro.",
    svg:`<svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg>`},
  {id:"geral",nome:"Qualquer",grupo:"QUALQUER FORMA",titulo:"Qualquer forma",
    desc:"Conta tudo: cartão, débito, Pix e dinheiro.",
    svg:`<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>`}
];
/* Plano em abas: Crédito, Débito·Pix, Qualquer e Metas. Cada bloco resume a
   sua lista e, tocado, mostra só ela — a página não cresce com o número de tetos. */
let PLANO_ABA=null;
const ringStyle=(pc,cor)=>`background:conic-gradient(${cor} 0 ${clamp(pc,0,100)}%,var(--track) ${clamp(pc,0,100)}% 100%)`;
function abaPadrao(p){
  const f=FORMAS.find(f=>orcamentosDe(p.ref,f.id).length);
  return f?f.id:"credito";
}
function linhaTeto(o,p){
  const c=cat(o.categoriaId); if(!c) return "";
  const g=gastoCategoria(o.categoriaId,p,formaOrc(o)), pc=g/o.valor*100;
  const cor=pc>=100?"var(--neg)":pc>=80?"var(--warn)":"var(--fc)";
  return `<button class="plrow" data-teto="${o.id}">
    <span class="plring" style="${ringStyle(pc,cor)}"><span>${esc(c.icone)}</span></span>
    <span class="mid"><span class="t1">${esc(c.nome)}</span><span class="t2 num">${money(g)} de ${money(o.valor)}</span></span>
    <span class="dir"><b class="num${pc>=100?" neg":pc>=80?" warn":""}">${Math.round(pc)}%</b>
      <span class="num">${g>o.valor?"excedeu "+money(r2(g-o.valor)):g===o.valor?"no limite":"restam "+money(r2(o.valor-g))}</span></span></button>`;
}
function linhaMeta(m){
  const pc=m.alvo>0?(m.acumulado||0)/m.alvo*100:0;
  const late=metaAtrasada(m), done=(m.acumulado||0)>=m.alvo&&m.alvo>0, ap=aporteSugerido(m);
  return `<button class="plrow" data-meta="${m.id}">
    <span class="plring" style="${ringStyle(pc,late?"var(--warn)":"var(--fc)")}"><span class="ini">${esc((m.nome||"?").trim().charAt(0).toUpperCase())}</span></span>
    <span class="mid"><span class="t1">${esc(m.nome)}</span><span class="t2 num">${money(m.acumulado||0)} de ${money(m.alvo)}${m.prazo?" · até "+fmtData(m.prazo):""}</span></span>
    <span class="dir"><b class="num${late?" warn":""}">${done?"✓":Math.round(pc)+"%"}</b>
      <span class="num">${done?"concluída":late?"atrasada":ap>0?money(ap)+"/mês":"sem prazo"}</span></span></button>`;
}

function viewPlano(){
  const p=periodo(OFFSET);
  let h=`<div class="filters" style="padding-top:0">
    <button data-off="-1">‹ mês anterior</button>
    <button aria-pressed="true" style="pointer-events:none">${esc(p.rotulo)}</button>
    <button data-off="1">próximo ›</button></div>`;

  if(!PLANO_ABA) PLANO_ABA=abaPadrao(p);
  const ABAS=[...FORMAS.map(f=>({id:f.id,nome:f.nome,svg:f.svg,grupo:f.grupo})),
    {id:"metas",nome:"Metas",grupo:"METAS",svg:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>`}];
  h+=`<div class="pltabs">`;
  ABAS.forEach(a=>{
    let n,G,T,alerta=0;
    if(a.id==="metas"){ n=S.metas.length; G=r2(S.metas.reduce((s,m)=>s+(m.acumulado||0),0)); T=r2(S.metas.reduce((s,m)=>s+(m.alvo||0),0)); }
    else{ const os=orcamentosDe(p.ref,a.id); n=os.length;
      G=r2(os.reduce((s,o)=>s+gastoCategoria(o.categoriaId,p,a.id),0)); T=r2(os.reduce((s,o)=>s+o.valor,0));
      alerta=os.filter(o=>gastoCategoria(o.categoriaId,p,a.id)>=o.valor*.8).length; }
    const pc=T>0?G/T*100:0, meta=a.id==="metas";
    h+=`<button class="orctile f-${meta?"meta":a.id}" data-planoaba="${a.id}" aria-pressed="${PLANO_ABA===a.id}">
      <span class="k" style="justify-content:space-between;width:100%"><span style="display:flex;align-items:center;gap:5px">${a.svg}${esc(a.nome.toUpperCase())}</span>
        <span style="font-weight:500;letter-spacing:0;color:var(--ink-soft)">${n} ${meta?(n===1?"meta":"metas"):(n===1?"teto":"tetos")}</span></span>
      <span class="v num">${n?semCentavos(G):"—"}</span>
      <span class="track" style="display:block"><i style="width:${clamp(pc,0,100)}%;background:${!meta&&pc>=80?"var(--warn)":"var(--fc)"}"></i></span>
      <span class="d num${alerta?" over":""}">${!n?(meta?"nenhuma meta":"sem teto"):meta?"guardados de "+semCentavos(T):"de "+semCentavos(T)+(alerta?" · "+alerta+" em alerta":"")}</span>
    </button>`;
  });
  h+=`</div>`;

  const aba=ABAS.find(a=>a.id===PLANO_ABA)||ABAS[0];
  const meta=aba.id==="metas";
  const lista=meta?S.metas.slice().sort((a,b)=>(b.acumulado||0)/(b.alvo||1)-(a.acumulado||0)/(a.alvo||1))
    :orcamentosDe(p.ref,aba.id).slice().sort((a,b)=>gastoCategoria(b.categoriaId,p,aba.id)/b.valor-gastoCategoria(a.categoriaId,p,aba.id)/a.valor);
  h+=`<div class="orcgh f-${meta?"meta":aba.id}" style="padding-top:20px"><span>${aba.grupo} · ${lista.length}</span>
    ${meta?`<button class="act" data-modal="meta">+ NOVA META</button>`:`<button class="act" data-teto="" data-forma="${aba.id}">+ NOVO TETO</button>`}</div>`;
  if(!lista.length){
    h+=meta?`<div class="empty"><b>Nenhuma meta ainda</b>Reserva, viagem, troca de celular — defina valor e prazo e o app calcula quanto guardar por mês.</div>`
      :`<div class="empty"><b>Nenhum teto ${aba.id==="geral"?"em qualquer forma":aba.id==="credito"?"no crédito":"no débito/Pix"}</b>${esc(FORMAS.find(f=>f.id===aba.id).desc)} Toque em “+ novo teto”.</div>`;
    const ant=periodo(OFFSET-1);
    if(!meta&&!(S.orcamentos||[]).some(o=>o.mesRef===p.ref&&o.valor>0)&&(S.orcamentos||[]).some(o=>o.mesRef===ant.ref&&o.valor>0))
      h+=`<button class="btn ghost" style="margin:10px 16px 0;width:calc(100% - 32px)" data-copiarorc>Copiar tetos de ${esc(MESES[ant.ini.getMonth()])}</button>`;
  }else{
    h+=`<div class="card f-${meta?"meta":aba.id}">${lista.map(x=>meta?linhaMeta(x):linhaTeto(x,p)).join("")}</div>`;
  }
  if(meta){
    const tot=r2(S.metas.reduce((a,m)=>a+aporteSugerido(m),0));
    if(tot>0) h+=`<div class="tiny" style="margin:10px 16px 0">Somando as metas: <b class="num">${money(tot)}</b> por mês, já descontado do “você pode gastar”.</div>`;
  }
  return h+`<div style="height:12px"></div>`;
}

/* ---------- GRÁFICOS ---------- */
let INST=null, NMESES=6;
function viewGraficos(){
  const insts=instituicoes();
  if(INST&&!insts.some(b=>b.nome===INST)) INST=null;
  const SN=serieMeses(NMESES,INST);
  const labels=SN.map(m=>m.rot);
  const escopo=INST||"todos os bancos";

  let h=`<div class="chips2" style="padding-top:2px">
    <button data-inst="" aria-pressed="${!INST}">Todos</button>
    ${insts.map(b=>`<button data-inst="${esc(b.nome)}" aria-pressed="${INST===b.nome}">${esc(b.nome)}</button>`).join("")}
  </div>
  <div class="segper">
    ${[6,12].map(n=>`<button data-nmes="${n}" aria-pressed="${NMESES===n}">${n} meses</button>`).join("")}
  </div>`;

  const totE=r2(SN.reduce((a,m)=>a+m.entra,0)), totS=r2(SN.reduce((a,m)=>a+m.sai,0));
  const liquido=r2(totE-totS);
  const vazio=totE===0&&totS===0;

  h+=`<div class="chart">
    <div class="chead"><div><h3>Entradas e saídas</h3><p class="cs">${esc(periodoTxt)} · ${esc(escopo)}</p></div>
      <div class="kpi ${liquido<0?"neg":""}"><span class="kv num">${liquido<0?"−":"+"}${eixo(Math.abs(liquido))}</span>
        <span class="kl">no período</span></div></div>`;
  if(vazio) h+=vazioChart("Nenhuma movimentação nesse período.");
  else h+=barrasDuplas([
      {nome:"Entrou",cor:corSerie("entra"),dados:SN.map(m=>m.entra)},
      {nome:"Saiu",cor:corSerie("sai"),dados:SN.map(m=>m.sai)}],labels)+
    `<div class="legrow"><span><i class="dot" style="background:${corSerie("entra")}"></i>Entrou ${money(totE)}</span>
      <span><i class="dot" style="background:${corSerie("sai")}"></i>Saiu ${money(totS)}</span></div>`;
  h+=`</div>`;

  const saldos=SN.map(m=>m.saldo);
  const fim=saldos[saldos.length-1]||0, ini=saldos[0]||0;
  const delta=r2(fim-ini);
  h+=`<div class="chart">
    <div class="chead"><div><h3>Saldo acumulado</h3><p class="cs">No fim de cada mês · ${esc(escopo)}</p></div>
      <div class="kpi"><span class="kv num">${eixo(fim)}</span><span class="kl">hoje</span></div></div>`;
  if(saldos.every(v=>v===0)) h+=vazioChart("Sem saldo registrado ainda.");
  else h+=linha(saldos,labels,"var(--accent-ink)")+
    `<div class="legrow"><span>${delta>=0?"Cresceu":"Caiu"} <b class="num">${eixo(Math.abs(delta))}</b> em ${esc(periodoTxt)}</span></div>`;
  h+=`</div>`;

  const somaCat=new Map();
  SN.forEach(m=>Object.entries(m.porCat).forEach(([id,v])=>somaCat.set(id,r2((somaCat.get(id)||0)+v))));
  const top=distinguir([...somaCat.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([id,v])=>{const c=cat(id);return {id,nome:c?c.nome:"Sem categoria",cor:catCor(c),valor:v};}));
  const lider=top[0];
  h+=`<div class="chart">
    <div class="chead"><div><h3>Gasto por categoria</h3><p class="cs">${top.length} maiores · ${esc(escopo)}</p></div>
      ${lider?`<div class="kpi"><span class="kv">${esc(lider.nome)}</span><span class="kl">lidera</span></div>`:""}</div>`;
  if(!top.length) h+=vazioChart("Sem despesas nesse período.");
  else h+=empilhado(SN.map(m=>m.porCat),labels,top)+
    `<div class="legrow">${top.map(c=>`<span><i class="dot" style="background:${c.cor}"></i>${esc(c.nome)}</span>`).join("")}</div>`;
  h+=`</div>`;

  if(insts.length>1){
    const p=periodo(OFFSET);
    const linhas=insts.map(b=>{
      const ts=vivas().filter(t=>dentro(t.data,p)&&txDaInst(t,b.nome));
      return {nome:b.nome,saldo:b.saldo,
        entra:r2(ts.filter(t=>t.tipo==="receita").reduce((a,t)=>a+t.valor,0)),
        sai:r2(ts.filter(t=>t.tipo==="despesa").reduce((a,t)=>a+t.valor,0))};
    });
    const maxv=Math.max(1,...linhas.flatMap(l=>[l.entra,l.sai]));
    h+=`<div class="chart">
      <div class="chead"><div><h3>Comparativo entre bancos</h3>
        <p class="cs">Movimentação de ${esc(periodo(OFFSET).rotulo.toLowerCase())}</p></div></div>`;
    linhas.forEach((l,i)=>{
      h+=`<div style="padding:12px 0${i?";border-top:1px solid var(--line)":""}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px">
          <b style="font-size:.94rem">${esc(l.nome)}</b>
          <span class="mono num" style="font-size:11px;color:var(--ink-soft)">saldo ${money(l.saldo)}</span></div>
        ${barraH("ENTROU",l.entra,maxv,corSerie("entra"))}
        ${barraH("SAIU",l.sai,maxv,corSerie("sai"))}
      </div>`;
    });
    h+=`</div>`;
  }else{
    h+=`<div class="chart"><div class="chead"><div><h3>Comparativo entre bancos</h3>
      <p class="cs">Aparece quando você tiver contas em mais de uma instituição.</p></div></div>
      <button class="btn ghost" data-modal="conta">Adicionar outro banco</button></div>`;
  }
  return h;
}

/* ============================ modais ============================ */
function closeModal(){ document.getElementById("modal").innerHTML=""; }
function openModal(html){
  document.getElementById("modal").innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>${html}</div></div>`;
  const m=document.getElementById("modal");
  m.querySelector("[data-scrim]").addEventListener("mousedown",e=>{ if(e.target.hasAttribute("data-scrim")) closeModal(); });
  const f=m.querySelector("input,select,textarea,button"); if(f&&!("ontouchstart" in window)) f.focus();
}
function head(t){ return `<div class="sheethead"><h2>${esc(t)}</h2>
  <button class="iconbtn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`; }

/* máscara de moeda em centavos */
function maskMoney(inp){
  const fmt=c=>BRL.format((c||0)/100);
  inp.dataset.cents=inp.dataset.cents||"0";
  inp.value=fmt(+inp.dataset.cents);
  inp.setAttribute("inputmode","numeric");
  inp.addEventListener("input",()=>{
    const dig=inp.value.replace(/\D/g,"").slice(0,11);
    inp.dataset.cents=dig?String(parseInt(dig,10)):"0";
    inp.value=fmt(+inp.dataset.cents);
  });
  inp.addEventListener("focus",()=>setTimeout(()=>inp.setSelectionRange(inp.value.length,inp.value.length),0));
  inp.addEventListener("click",()=>inp.setSelectionRange(inp.value.length,inp.value.length));
}
const centsOf=inp=>r2((+(inp.dataset.cents||0))/100);
function setCents(inp,v){ inp.dataset.cents=String(Math.round((v||0)*100)); inp.value=BRL.format(v||0); }

/* ---------- lançamento ---------- */
let LANC={tipo:"despesa",forma:"debito"};
const opcoesConta=(lista,ed)=>lista.map(c=>`<option value="${c.id}" ${ed&&ed.contaId===c.id?"selected":""}>${esc(c.nome)}</option>`).join("");
/* No débito entram conta corrente, poupança e carteira; no crédito, só cartões. */
function campoContaForma(forma,ed){
  const lista=forma==="credito"?cartoes():contasPag();
  if(!lista.length) return forma==="credito"
    ?`<div class="note warn" style="margin:0">Nenhum cartão de crédito cadastrado. Crie um em <b>Ajustes → Contas</b>, com tipo “Cartão de crédito”.</div>`
    :`<div class="note warn" style="margin:0">Nenhuma conta ativa. Crie uma em <b>Ajustes → Contas</b>.</div>`;
  return `<select id="lConta">${opcoesConta(lista,ed)}</select>`;
}
function modalEditPagfatura(ed){
  const c=conta(ed.cartaoId);
  let h=head("Pagamento de fatura");
  h+=`<div class="tiny" style="margin-bottom:14px">${esc(c?c.nome:"Cartão")} · fatura ${ed.faturaRef||"—"}</div>`;
  h+=`<div class="field"><label>Valor</label><input id="qVal" class="amount"></div>`;
  h+=`<div class="field"><label>Pago com</label><select id="qConta">${contasPag().map(x=>`<option value="${x.id}" ${x.id===ed.contaId?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></div>`;
  h+=`<div class="field"><label>Data</label><input type="date" id="qData" value="${ed.data}"></div>`;
  h+=`<button class="btn" id="qSalvar">Salvar alterações</button>`;
  h+=`<button class="btn danger" style="margin-top:10px" data-excluir="${ed.id}">Excluir pagamento</button>`;
  openModal(h);
  const v=document.getElementById("qVal"); maskMoney(v); setCents(v,ed.valor);
  document.getElementById("qSalvar").addEventListener("click",()=>{
    const valor=centsOf(v); if(valor<=0) return toast("Informe um valor","err");
    ed.valor=valor; ed.contaId=document.getElementById("qConta").value;
    ed.data=document.getElementById("qData").value||ed.data;
    persist(); closeModal(); render(); toast("Pagamento atualizado");
  });
}
function modalLancamento(txId){
  const ed=txId?vivas().find(t=>t.id===txId):null;
  if(ed&&ed.tipo==="pagfatura") return modalEditPagfatura(ed);
  if(ed) LANC.tipo=ed.tipo==="pagfatura"?"transferencia":ed.tipo;

  const cats=S.categorias.filter(c=>!c.arquivada&&c.tipo===(tipo==="receita"?"receita":"despesa"));

  const rec=ed&&ed.recorrenciaId?(S.recorrencias||[]).find(x=>x.id===ed.recorrenciaId):null;
  let h=head(rec?"Ocorrência de conta fixa":ed?"Editar lançamento":"Novo lançamento");
  if(rec) h+=`<div class="note" style="margin:0 0 16px">

  else if(ed&&ed.recorrenciaId) h+=`<div class="note warn" style="margin:0 0 16px">Este lançamento veio de uma conta fixa que já foi excluída.</div>`;
  if(!ed) h+=`<div class="seg" style="margin-bottom:16px">
    ${[["despesa","Despesa"],["receita","Receita"],["transferencia","Transferência"]].map(([v,l])=>
      `<button data-tipo="${v}" data-v="${v}" aria-pressed="${tipo===v}">${l}</button>`).join("")}</div>`;

  h+=`<div class="field"><label>Valor</label>
    <input id="lVal" class="amount ${tipo==="receita"?"pos":tipo==="despesa"?"neg":""}" autocomplete="off"></div>`;

  if(tipo==="transferencia"){
    h+=`<div class="two">
      <div class="field"><label>De</label><select id="lDe">${todas.map(c=>`<option value="${c.id}" ${ed&&ed.contaId===c.id?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></div>
      <div class="field"><label>Para</label><select id="lPara">${todas.map((c,i)=>`<option value="${c.id}" ${ed?(ed.contaDestinoId===c.id?"selected":""):(i===1?"selected":"")}>${esc(c.nome)}</option>`).join("")}</select></div>
    </div>`;
  }else{
    h+=`<div class="field"><label>Categoria</label><div class="chips" id="lCats">
      ${cats.map(c=>`<button type="button" data-cat="${c.id}" aria-pressed="${ed?ed.categoriaId===c.id:false}"><span>${esc(c.icone)}</span>${esc(c.nome)}</button>`).join("")}
    </div></div>`;
    if(tipo==="receita"){
      h+=`<div class="field"><label>Entrou na conta</label>
        <select id="lConta">${opcoesConta(pagos,ed)}</select></div>`;
    }else{
      if(ed) LANC.forma=formaDe(ed);
      h+=`<div class="field"><label>Forma de pagamento</label><div class="seg" id="lForma">
        <button type="button" data-forma="debito" aria-pressed="${LANC.forma!=="credito"}">Débito · Pix · dinheiro</button>
        <button type="button" data-forma="credito" aria-pressed="${LANC.forma==="credito"}">Crédito</button></div></div>`;
      h+=`<div class="field"><label>Pago com</label><div id="lContaBox">${campoContaForma(LANC.forma,ed)}</div></div>`;
    }
  }

  h+=`<div class="two">
    <div class="field"><label>Data</label><input type="date" id="lData" value="${ed?ed.data:hoje()}"></div>
    ${tipo==="despesa"&&!ed?`<div class="field" id="lParcBox"${LANC.forma==="credito"?"":" hidden"}><label>Parcelas</label><select id="lParc">
      ${Array.from({length:24},(_,i)=>i+1).map(n=>`<option value="${n}">${n}x</option>`).join("")}</select></div>`:`<div class="field"><label>&nbsp;</label><div class="help">&nbsp;</div></div>`}
  </div>`;
  h+=`<div class="field"><label>Descrição</label><input id="lDesc" placeholder="opcional" value="${ed?esc(ed.descricao||""):""}" autocomplete="off"></div>`;
  if(ed&&ed.descricao){
    const iguais=vivas().filter(t=>t.id!==ed.id&&t.tipo===ed.tipo&&norm(t.descricao)===norm(ed.descricao));
    if(iguais.length) h+=`<label class="marcar"><input type="checkbox" id="lTodos">
      <span>Aplicar a categoria aos outros <b>${iguais.length}</b> lançamentos com esta mesma descrição</span></label>`;
  }
  h+=`<div id="lAviso"></div>`;
  h+=`<button class="btn" id="lSalvar">${ed?(rec?"Salvar só este mês":"Salvar alterações"):"Lançar"}</button>`;
  if(rec){
    h+=`<button class="btn ghost" style="margin-top:10px" data-editrec="${rec.id}">Editar a conta fixa (todos os meses)</button>`;
    h+=`<div class="btnrow"><button class="btn danger" data-excluir="${ed.id}">Pular só este mês</button>
      <button class="btn danger" data-delrec="${rec.id}">Excluir a conta fixa</button></div>`;
    h+=`<div class="tiny" style="margin-top:10px">“Pular só este mês” apaga esta ocorrência e ela não volta. As outras seguem normais.</div>`;
  }else if(ed) h+=`<button class="btn danger" style="margin-top:10px" data-excluir="${ed.id}">Excluir lançamento</button>`;

    if(dv>hoje()) av.innerHTML=`<div class="note">Data no futuro: entra como <b>previsto</b>.
      Confirme no extrato quando acontecer.</div>`;
    if(c&&c.tipo==="cartao"){
      const d=document.getElementById("lData").value||hoje();
      const ref=faturaDe(c,d); const v=vencimentoFatura(c,ref);
      const n=parc?+parc.value:1; const vv=centsOf(val);
      av.innerHTML=`<div class="note warn">Vai para a fatura de <b>${ref.split("-")[1]}/${ref.split("-")[0]}</b>, que vence em ${fmtData(v)}. Não sai da sua conta agora.
        ${n>1&&vv>0?`<br>${n}x de <b>${money(r2(vv/n))}</b>, uma em cada fatura.`:""}</div>`;
    }
  };
  ["lConta","lData","lParc","lVal"].forEach(id=>{const e=document.getElementById(id); if(e) e.addEventListener("change",upd);});

    upd();
  }));

  document.getElementById("lSalvar").addEventListener("click",()=>salvarLanc(ed));
}

function salvarLanc(ed){
  const tipo=ed?ed.tipo:LANC.tipo;
  const valor=centsOf(document.getElementById("lVal"));
  if(valor<=0) return toast("Informe um valor","err");
  const data=document.getElementById("lData").value||hoje();
  const desc=document.getElementById("lDesc").value.trim();

  if(tipo==="transferencia"||tipo==="pagfatura"){
    const de=document.getElementById("lDe").value, para=document.getElementById("lPara").value;
    if(de===para) return toast("Escolha contas diferentes","err");
    if(ed){ Object.assign(ed,{valor,data,descricao:desc,contaId:de,contaDestinoId:para}); }
    else S.transacoes.push({id:uid(),tipo:"transferencia",valor,data,descricao:desc,contaId:de,contaDestinoId:para,status:"efetivada"});
  }else{
    const catBtn=document.querySelector("#lCats button[aria-pressed='true']");
    if(!catBtn) return toast("Escolha uma categoria","err");
    const categoriaId=catBtn.dataset.cat;
    const cs=document.getElementById("lConta");
    if(!cs) return toast(LANC.forma==="credito"?"Cadastre um cartão em Ajustes → Contas":"Cadastre uma conta em Ajustes → Contas","err");
    const contaId=cs.value;
    const c=conta(contaId);
    if(ed){
      const antes=ed.descricao, catAntiga=ed.categoriaId;
      Object.assign(ed,{valor,data,descricao:desc,categoriaId,contaId});
      if(ed.recorrenciaId||ed.salarioRef) ed.editado=true;
      const todos=document.getElementById("lTodos");
      if(todos&&todos.checked&&antes){
        let n=0;
        vivas().forEach(t=>{ if(t.id!==ed.id&&t.tipo===ed.tipo&&norm(t.descricao)===norm(antes)
          &&t.categoriaId!==categoriaId){ t.categoriaId=categoriaId; n++; } });
        if(n) setTimeout(()=>toast(n+" lançamentos reclassificados"),400);
      }
      ed.faturaRef=(c&&c.tipo==="cartao")?faturaDe(c,data):undefined;
    }else{
      const parcEl=document.getElementById("lParc");
      const n=(tipo==="despesa"&&parcEl)?+parcEl.value:1;
      if(n>1&&c&&c.tipo==="cartao"){
        const base=Math.floor(valor*100/n)/100; const resto=r2(valor-base*n);
        const paiId=uid();
        for(let i=0;i<n;i++){
          const d=parseISO(data); const dd=new Date(d.getFullYear(),d.getMonth()+i,d.getDate());
          S.transacoes.push({id:i===0?paiId:uid(),tipo:"despesa",valor:i===0?r2(base+resto):base,data:iso(dd),
            descricao:desc,categoriaId,contaId,status:"efetivada",faturaRef:faturaDe(c,iso(dd)),
            parcelaAtual:i+1,parcelaTotal:n,paiId});
        }
      }else{
        S.transacoes.push({id:uid(),tipo,valor,data,descricao:desc,categoriaId,contaId,status:"efetivada",
          previsto:data>hoje(),
          faturaRef:(c&&c.tipo==="cartao")?faturaDe(c,data):undefined});
      }
    }
  }
  persist(); closeModal(); render();
  toast(ed?"Lançamento atualizado":"Lançado "+money(valor));
}

/* ---------- categorias ---------- */
/* Emoji da categoria: qualquer um do teclado (inclusive os compostos, como 🏷️
   ou 👨‍👩‍👧, que têm vários code points) ou um da grade de sugestões. */
const EMOJIS_SUG=["🏠","🛒","🚗","🍽️","☕","🍺","💊","🏋️","📚","🎓","🎬","🎮","📺","🎵","👕","👟","💇","🐶",
  "👶","🎁","✈️","🏖️","⛽","🚌","🚕","📱","💻","💡","💧","🔥","🧾","🏦","💳","💰","💼","🪙","📈","↩️","🧹","🔧","❤️","•"];
function primeiroEmoji(v){
  v=(v||"").trim(); if(!v) return "";
  try{ return [...new Intl.Segmenter("pt-BR",{granularity:"grapheme"}).segment(v)][0].segment; }
  catch{ return [...v][0]; }
}
function modalCategoria(id,tipoInicial){
  const c=id?cat(id):null;
  let ico=c?c.icone:"•";
  let h=head(c?"Editar categoria":"Nova categoria");
  h+=`<div class="field"><label>Tipo</label><div class="seg" id="kTipo">
    <button type="button" data-ktipo="despesa" aria-pressed="${(c?c.tipo:tipoInicial||"despesa")==="despesa"}">Despesa</button>
    <button type="button" data-ktipo="receita" aria-pressed="${(c?c.tipo:tipoInicial)==="receita"}">Receita</button></div></div>`;
  h+=`<div class="field"><label for="kNome">Nome</label>
    <div style="display:flex;gap:10px;align-items:stretch">
      <span id="kPrev" aria-hidden="true" style="width:54px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--surface-3);display:grid;place-items:center;font-size:26px"></span>
      <input id="kNome" value="${c?esc(c.nome):""}" placeholder="Academia" autocomplete="off"></div></div>`;
  h+=`<div class="field"><label for="kIco">Emoji</label>
    <div class="emojigrid" id="kEmojis">${EMOJIS_SUG.map(e=>`<button type="button" data-emo="${e}" aria-label="Usar ${e}">${e}</button>`).join("")}</div>
    <input id="kIco" placeholder="ou digite / cole qualquer emoji" autocomplete="off" style="margin-top:8px">
    <div class="help">Toque num emoji acima ou use o teclado de emojis do celular.</div></div>`;
  h+=`<div class="field" id="kCorWrap"><label>Cor</label><div class="chips" id="kCores">${PALETA().map((p,i)=>
    `<button type="button" data-slot="${i}" aria-label="Cor ${i+1}" aria-pressed="${c?(c.slot||0)===i:i===0}" style="width:40px;height:40px;padding:0;background:${p};border-radius:11px"></button>`).join("")}</div>
    <div class="help">Verde e vermelho não entram: verde marca entradas, vermelho marca saídas.</div></div>`;
  h+=`<div class="field" id="kCorFixa" hidden><label>Cor</label>
    <div style="display:flex;align-items:center;gap:10px"><i class="dot" style="width:16px;height:16px;background:${corSerie("entra")}"></i>
    <span class="tiny">Receitas usam sempre o verde de entrada.</span></div></div>`;
  h+=`<button class="btn" id="kSalvar">${c?"Salvar":"Criar categoria"}</button>`;
  if(c) h+=`<button class="btn danger" style="margin-top:10px" data-arqcat="${c.id}">${c.arquivada?"Reativar":"Arquivar"}</button>`;
  openModal(h);
  const m=document.getElementById("modal");
  const tipoAtual=()=>m.querySelector("[data-ktipo][aria-pressed='true']").dataset.ktipo;
  const sinc=()=>{
    const r=tipoAtual()==="receita";
    document.getElementById("kCorWrap").hidden=r; document.getElementById("kCorFixa").hidden=!r;
    const slot=+m.querySelector("#kCores button[aria-pressed='true']").dataset.slot;
    const pv=document.getElementById("kPrev");
    pv.textContent=ico;
    pv.style.background=`color-mix(in srgb, ${r?corSerie("entra"):slotCor(slot)} 18%, var(--surface-3))`;
    m.querySelectorAll("[data-emo]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.emo===ico)));
  };
  m.querySelectorAll("[data-ktipo]").forEach(b=>b.addEventListener("click",()=>{
    m.querySelectorAll("[data-ktipo]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); sinc();}));
  m.querySelectorAll("#kCores button").forEach(b=>b.addEventListener("click",()=>{
    m.querySelectorAll("#kCores button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true"); sinc();
  }));
  m.querySelectorAll("[data-emo]").forEach(b=>b.addEventListener("click",()=>{
    ico=b.dataset.emo; document.getElementById("kIco").value=""; sinc();}));
  document.getElementById("kIco").addEventListener("input",e=>{
    const v=primeiroEmoji(e.target.value); if(v){ ico=v; sinc(); }});
  sinc();
  if(!c) setTimeout(()=>document.getElementById("kNome").focus(),80);
  document.getElementById("kSalvar").addEventListener("click",()=>{
    const nome=document.getElementById("kNome").value.trim();
    if(!nome) return toast("Dê um nome","err");
    const tipo=tipoAtual();
    if(S.categorias.some(x=>x!==c&&x.tipo===tipo&&norm(x.nome)===norm(nome)))

      slot:+m.querySelector("#kCores button[aria-pressed='true']").dataset.slot||0,arquivada:c?c.arquivada:false};
    if(c) Object.assign(c,o); else S.categorias.push(Object.assign({id:uid()},o));
    persist(); closeModal(); render(); toast(c?"Categoria salva":"Categoria criada");
  });
}

/* ---------- orçamento ---------- */
function modalTeto(id,formaInicial){
  const p=periodo(OFFSET);
  const ed=id?(S.orcamentos||[]).find(o=>o.id===id):null;
  const ref=ed?ed.mesRef:p.ref;
  const cs=S.categorias.filter(c=>!c.arquivada&&c.tipo==="despesa");
  const T={cat:ed?ed.categoriaId:null,forma:ed?formaOrc(ed):(FORMAS.some(f=>f.id===formaInicial)?formaInicial:"geral")};
  let h=head(ed?"Editar teto":"Novo teto");
  h+=`<div class="field"><label>Valor por mês</label><input id="tVal" class="amount" autocomplete="off"></div>`;
  h+=`<div class="field"><label>Categoria</label><div class="chips" id="tCats">
    ${cs.map(c=>`<button type="button" data-tcat="${c.id}" aria-pressed="${T.cat===c.id}"><span>${esc(c.icone)}</span>${esc(c.nome)}</button>`).join("")}
  </div></div>`;
  h+=`<div class="field"><label>Vale para</label>
    ${FORMAS.slice().sort((a,b)=>(a.id==="geral"?-1:0)-(b.id==="geral"?-1:0)).map(f=>`<button type="button" class="optf f-${f.id}" data-tforma="${f.id}" aria-pressed="${T.forma===f.id}">
      <span class="ic">${f.svg}</span><span class="tx"><b>${esc(f.titulo)}</b><span>${esc(f.desc)}</span></span>
      <span class="ck"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></span></button>`).join("")}
  </div>`;
  h+=`<div id="tAviso"></div>`;
  h+=`<button class="btn" id="tSalvar">Salvar teto</button>`;
  if(ed) h+=`<button class="btn danger" style="margin-top:10px" id="tExcluir">Excluir teto</button>`;
  h+=`<div class="tiny" style="margin-top:10px;text-align:center">O app avisa em 80% e no estouro — nunca bloqueia um lançamento.</div>`;
  openModal(h);
  const val=document.getElementById("tVal"); maskMoney(val); if(ed) setCents(val,ed.valor);
  if(!ed) setTimeout(()=>val.focus(),80);
  const m=document.getElementById("modal");
  const sufixo=f=>ROTULO_FORMA[f]||"";
  const outro=(cid,f)=>(S.orcamentos||[]).find(o=>o!==ed&&o.mesRef===ref&&o.categoriaId===cid&&formaOrc(o)===f&&o.valor>0);
  const upd=()=>{
    m.querySelectorAll("[data-tcat]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tcat===T.cat)));
    m.querySelectorAll("[data-tforma]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tforma===T.forma)));
    const c=T.cat&&cat(T.cat), av=document.getElementById("tAviso");
    document.getElementById("tSalvar").textContent=c?"Salvar teto · "+c.nome+sufixo(T.forma):"Salvar teto";
    if(!c){ av.innerHTML=""; return; }
    const notas=[];
    const g=gastoCategoria(T.cat,p,T.forma);
    if(g>0) notas.push(`Neste mês você já gastou <b>${money(g)}</b> em ${esc(c.nome)}${esc(sufixo(T.forma))}.`);
    const dup=outro(T.cat,T.forma);
    if(dup) notas.push(`Já existe um teto de ${esc(c.nome)}${esc(sufixo(T.forma))} (${money(dup.valor)}). Salvar <b>substitui</b> esse valor.`);
    FORMAS.filter(f=>f.id!==T.forma).forEach(f=>{ const o=outro(T.cat,f.id);
      if(o) notas.push(`${esc(c.nome)} também tem teto de ${money(o.valor)} em <b>${esc(f.titulo.toLowerCase())}</b>. Os dois valem juntos: o app avisa no que estourar primeiro.`); });
    av.innerHTML=notas.length?`<div class="note" style="margin:0 0 14px">${notas.join("<br>")}</div>`:"";
  };
  m.querySelectorAll("[data-tcat]").forEach(b=>b.addEventListener("click",()=>{T.cat=b.dataset.tcat;upd();}));
  m.querySelectorAll("[data-tforma]").forEach(b=>b.addEventListener("click",()=>{T.forma=b.dataset.tforma;upd();}));
  upd();
  document.getElementById("tSalvar").addEventListener("click",()=>{
    const v=centsOf(val);
    if(v<=0) return toast("Informe um valor","err");
    if(!T.cat) return toast("Escolha uma categoria","err");
    if(!Array.isArray(S.orcamentos)) S.orcamentos=[];
    const dup=outro(T.cat,T.forma);
    if(dup){ dup.valor=v; if(ed) S.orcamentos=S.orcamentos.filter(o=>o!==ed); }
    else if(ed){ ed.valor=v; ed.categoriaId=T.cat; if(T.forma==="geral") delete ed.forma; else ed.forma=T.forma; }
    else S.orcamentos.push({id:uid(),categoriaId:T.cat,mesRef:ref,valor:v,...(T.forma==="geral"?{}:{forma:T.forma})});
    persist(); closeModal(); render(); toast("Teto salvo");
  });
  const ex=document.getElementById("tExcluir");
  if(ex) ex.addEventListener("click",()=>{
    S.orcamentos=S.orcamentos.filter(o=>o!==ed);
    persist(); closeModal(); render(); toast("Teto excluído");
  });
}
function copiarTetos(){
  const p=periodo(OFFSET), ant=periodo(OFFSET-1);
  let n=0;
  (S.orcamentos||[]).filter(o=>o.mesRef===ant.ref&&o.valor>0).forEach(o=>{
    if(S.orcamentos.some(x=>x.mesRef===p.ref&&x.categoriaId===o.categoriaId&&formaOrc(x)===formaOrc(o))) return;
    S.orcamentos.push({...o,id:uid(),mesRef:p.ref}); n++;
  });
  persist(); render(); toast(n+(n===1?" teto copiado":" tetos copiados"));
}

/* ============================ F14 — importar extrato do banco ============================
   Esta é a camada que o Open Finance vai reaproveitar: qualquer origem entrega uma
   lista normalizada e a conciliação (RN12) decide se confirma uma previsão, se cria
   um lançamento novo, ou se ignora por já existir. */

const DICIONARIO=[
  [/(mercado|supermerc|atacad|carrefour|assai|pao de acucar|oba |big |extra )/i,"Mercado"],
  [/(ifood|rappi|restaurante|lanchon|burger|pizza|padaria|cafe|bar )/i,"Alimentação fora"],
  [/(uber|99app|99 |posto |shell|ipiranga|petrobr|combust|estacion|metro|onibus|passagem)/i,"Transporte"],
  [/(farmac|drogar|droga ?raia|hospital|clinica|laborat|unimed|amil|odonto)/i,"Saúde"],
  [/(netflix|spotify|prime video|disney|hbo|max |youtube|apple\.com|icloud|google ?one)/i,"Assinaturas"],
  [/(aluguel|condominio|energia|eletropaulo|enel|cemig|copel|sabesp|agua |gas |internet|vivo|claro|tim |oi fibra)/i,"Moradia"],
  [/(escola|colegio|faculdade|universid|curso|udemy|alura|coursera)/i,"Educação"],
  [/(cinema|ingresso|show |teatro|steam|playstation|xbox|nintendo)/i,"Lazer"],
  [/(iptu|ipva|darf|das |tributo|taxa |cartorio|licenciam)/i,"Impostos e taxas"],
  [/(renner|zara|riachuelo|c&a|centauro|nike|adidas|shein)/i,"Vestuário"],
  [/(salario|salário|proventos|remunera|folha de pag|pagto salario)/i,"Salário"],
  [/(freela|freelance|prestacao de servico|nota fiscal)/i,"Freelance"],
  [/(rendimento|juros|dividendo|cdb|tesouro)/i,"Rendimentos"]
];
function acharCat(nome,tipo){
  const c=S.categorias.find(x=>!x.arquivada&&x.tipo===tipo&&x.nome.toLowerCase()===nome.toLowerCase());
  return c?c.id:null;
}
const norm=t=>(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
/* Primeiro tenta o próprio histórico: se você já classificou algo parecido, repete.
   Só depois cai no dicionário. */
function adivinharCategoria(desc,tipo){
  const n=norm(desc);
  if(n.length>2){
    const anterior=vivas().filter(t=>t.tipo===tipo&&t.categoriaId&&t.descricao)
      .find(t=>{const d=norm(t.descricao); return d&&(d===n||(d.length>3&&n.includes(d))||(n.length>3&&d.includes(n)));});
    if(anterior) return anterior.categoriaId;
  }
  for(const [re,nome] of DICIONARIO){
    if(re.test(desc)){ const id=acharCat(nome,tipo); if(id) return id; }
  }
  return acharCat("Outros",tipo);
}

/* Descrições de banco vêm com CPF mascarado, agência e conta. Nada disso ajuda a
   entender o gasto, e o documento é dado pessoal que não precisa ficar guardado. */
function limparDescricao(s){
  s=(s||"").replace(/\s+/g," ").trim();
  s=s.replace(/^transfer[êe]ncia recebida pelo pix/i,"Pix recebido")
     .replace(/^transfer[êe]ncia enviada pelo pix/i,"Pix enviado")
     .replace(/^transfer[êe]ncia recebida/i,"Recebido")
     .replace(/^transfer[êe]ncia enviada/i,"Enviado")
     .replace(/^compra no d[ée]bito/i,"Débito")
     .replace(/^pagamento de boleto[^-]*/i,"Boleto");
  const partes=s.split(/\s+-\s+/).map(x=>x.trim()).filter(n=>{
    if(!n) return false;
    if(/[•*]{2,}/.test(n)) return false;
    if(/^\(?\d{3,4}\)?$/.test(n)) return false;
    if(/ag[êe]ncia\s*:/i.test(n)||/conta\s*:/i.test(n)) return false;
    if(/^banco\b.*\(\d+\)/i.test(n)) return false;
    return true;
  });
  let r=partes.join(" · ").replace(/\s+/g," ").trim();
  if(r.length>64) r=r.slice(0,63).trimEnd()+"…";
  return r||s.slice(0,64)||"Lançamento";
}

/* Itaú e vários bancos exportam em windows-1252. Ler tudo como UTF-8 embaralha
   os acentos, então testamos UTF-8 no modo estrito e caímos para latin-1. */
function decodificar(buf){
  const b=new Uint8Array(buf);
  if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF) return new TextDecoder("utf-8").decode(buf);
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }
  catch(e){ try{ return new TextDecoder("windows-1252").decode(buf); }
            catch(_){ return new TextDecoder().decode(buf); } }
}
/* "SALDO ANTERIOR", "SALDO DO DIA", "S A L D O" — o Itaú intercala essas linhas
   no extrato. São fotografias do saldo, não movimentações. */
const ehSaldo=d=>/^s\s*a\s*l\s*d\s*o\b/.test(norm(d));

function cortaLinha(l,sep){
  const o=[]; let cur="",asp=false;
  for(let i=0;i<l.length;i++){const ch=l[i];
    if(ch==='"'){ if(asp&&l[i+1]==='"'){cur+='"';i++;} else asp=!asp; }
    else if(ch===sep&&!asp){o.push(cur);cur="";} else cur+=ch;}
  o.push(cur); return o.map(x=>x.trim());
}
const sepDe=l=>{const p=(l.match(/;/g)||[]).length,v=(l.match(/,/g)||[]).length,t=(l.match(/\t/g)||[]).length;
  if(t>0&&t>=p&&t>=v) return "\t"; return p>=v?";":",";};
function paraData(v){
  v=(v||"").trim();
  let m=v.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
  if(m) return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
  m=v.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  m=v.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2})$/);
  if(m) return "20"+m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
  return null;
}
function paraNum(v){
  v=(v||"").replace(/[R$\s ]/gi,"");
  if(!v||!/\d/.test(v)) return NaN;
  const neg=/^-/.test(v)||/\)$/.test(v);
  v=v.replace(/[()-]/g,"");
  if(v.includes(",")&&v.includes(".")) v=v.replace(/\./g,"").replace(",",".");
  else if(v.includes(",")) v=v.replace(",",".");
  const n=parseFloat(v);
  return isFinite(n)?(neg?-n:n):NaN;
}

function parseOFX(txt){
  const out=[];
  const blocos=txt.split(/<STMTTRN\s*>/i).slice(1);
  const tag=(b,t)=>{const m=b.match(new RegExp("<"+t+"\\s*>([^<\\r\\n]*)","i"));return m?m[1].trim():"";};
  blocos.forEach(b=>{
    const dt=tag(b,"DTPOSTED").replace(/[^\d]/g,"").slice(0,8);
    const v=paraNum(tag(b,"TRNAMT"));
    if(dt.length!==8||!isFinite(v)||v===0) return;
    const memo=tag(b,"MEMO")||tag(b,"NAME")||"Lançamento";
    if(ehSaldo(memo)) return;
    out.push({data:dt.slice(0,4)+"-"+dt.slice(4,6)+"-"+dt.slice(6,8),
      valor:Math.abs(r2(v)), tipo:v<0?"despesa":"receita",
      descricao:limparDescricao(memo), fitid:tag(b,"FITID")||null});
  });
  const bal=txt.match(/<LEDGERBAL>[\s\S]*?<BALAMT\s*>([^<\r\n]*)/i);
  if(bal){ const v=paraNum(bal[1]); if(isFinite(v)) out.saldoFinal=r2(v); }
  return out;
}

/* Bancos põem um cabeçalho de apresentação antes da tabela (o Inter usa cinco
   linhas com conta, período e saldo). Por isso procuramos a linha de títulos em
   vez de assumir que é a primeira. */
function parseCSV(txt){
  const linhas=txt.replace(/^﻿/,"").split(/\r?\n/);
  let iCab=-1, sep=";", cab=[];
  for(let i=0;i<Math.min(30,linhas.length);i++){
    const l=linhas[i]; if(!l.trim()) continue;
    const s=sepDe(l), cols=cortaLinha(l,s).map(norm);
    if(cols.length<2) continue;
    const temData=cols.some(c=>c.includes("data")||c==="date");
    const temValor=cols.some(c=>c.includes("valor")||c.includes("amount")||c.includes("montante"));
    if(temData&&temValor){ iCab=i; sep=s; cab=cols; break; }
  }
  let iD,iV,iDesc,iId,inicio,iSaldo=-1;
  if(iCab>=0){
    const acha=(...alvos)=>cab.findIndex(c=>alvos.some(a=>c.includes(a)));
    iD=acha("data","date");
    /* "Saldo" não é valor */
    iV=cab.findIndex(c=>(c.includes("valor")||c.includes("amount")||c.includes("montante"))&&!c.includes("saldo"));
    iDesc=acha("descri","estabelec","memo","beneficiar","favorec","contraparte");
    /* "Data Lançamento" contém "lancamento": a coluna de data não pode virar descrição */
    if(iDesc<0) iDesc=cab.findIndex((c,i)=>i!==iD&&i!==iV&&
      /(histor|lancamento|tipo|operacao|transacao|titulo)/.test(c));
    iId=cab.findIndex(c=>c==="identificador"||c==="id"||c.includes("fitid")||c.includes("identific"));
    iSaldo=cab.findIndex(c=>c.includes("saldo"));
    inicio=iCab+1;
  }else{
    inicio=linhas.findIndex(l=>l.trim()&&paraData(cortaLinha(l,sepDe(l))[0]));
    if(inicio<0) return [];
    sep=sepDe(linhas[inicio]);
    const cols=cortaLinha(linhas[inicio],sep);
    iD=0;
    iV=cols.map(paraNum).reduce((best,n,i)=>(isFinite(n)&&i>0?i:best),-1);
    iDesc=cols.findIndex((c,i)=>i>0&&i!==iV&&!isFinite(paraNum(c))&&c.length>2);
    iId=-1;
  }
  if(iD<0||iV<0) return [];
  const out=[];
  for(let i=inicio;i<linhas.length;i++){
    const l=linhas[i]; if(!l.trim()) continue;
    const col=cortaLinha(l,sep); if(col.length<2) continue;
    const d=paraData(col[iD]); const v=paraNum(col[iV]);
    if(!d||!isFinite(v)||v===0) continue;
    const bruta=iDesc>=0?col[iDesc]:"Lançamento";
    if(ehSaldo(bruta)) continue;
    const linha={data:d,valor:Math.abs(r2(v)),tipo:v<0?"despesa":"receita",
      descricao:limparDescricao(bruta),
      fitid:(iId>=0&&col[iId])?col[iId]:null};
    if(iSaldo>=0){ const sd=paraNum(col[iSaldo]); if(isFinite(sd)) linha._saldo=r2(sd); linha._v=r2(v); }
    out.push(linha);
  }
  /* Alguns bancos trazem o saldo corrente em cada linha. O saldo da linha mais
     antiga menos o valor dela é o saldo que existia antes do extrato começar. */
  const comSaldo=out.filter(x=>x._saldo!==undefined);
  if(comSaldo.length){
    /* Ordenar só por data embaralha os lançamentos de um mesmo dia, e é justamente
       o primeiro deles que revela o saldo anterior. A ordem do arquivo é que vale:
       descobrimos se ele vem do mais novo para o mais antigo e usamos as pontas. */
    const desc=comSaldo[0].data>comSaldo[comSaldo.length-1].data;
    const primeira=desc?comSaldo[comSaldo.length-1]:comSaldo[0];
    const ultima=desc?comSaldo[0]:comSaldo[comSaldo.length-1];
    out.saldoAntes=r2(primeira._saldo-primeira._v);
    out.saldoFinal=ultima._saldo;
  }
  out.forEach(x=>{ delete x._saldo; delete x._v; });
  return out;
}

/* RN12 — conciliação */
function conciliar(lista,contaId){
  const jaTem=new Set(vivas().filter(t=>t.fitid).map(t=>t.fitid));
  const usados=new Set();
  const res={casados:[],novos:[],dupes:[]};
  lista.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(imp=>{
    if(imp.fitid&&jaTem.has(imp.fitid)){ res.dupes.push(imp); return; }
    /* mesmo lançamento já registrado à mão e confirmado? */
    const igual=vivas().find(t=>!usados.has(t.id)&&!ehPrevisto(t)&&t.contaId===contaId&&t.tipo===imp.tipo
      &&t.data===imp.data&&Math.abs(t.valor-imp.valor)<0.005);
    if(igual){ usados.add(igual.id); res.dupes.push(imp); return; }
    /* uma previsão compatível? tolerância de 5 dias e 2% (mínimo R$ 1) */
    const tol=Math.max(1,imp.valor*0.02);
    const cand=vivas().filter(t=>!usados.has(t.id)&&ehPrevisto(t)&&t.tipo===imp.tipo
      &&t.contaId===contaId&&Math.abs(t.valor-imp.valor)<=tol
      &&Math.abs(parseISO(t.data)-parseISO(imp.data))<=5*86400000)
      .sort((a,b)=>Math.abs(a.valor-imp.valor)-Math.abs(b.valor-imp.valor));
    if(cand.length){ usados.add(cand[0].id); res.casados.push({imp,alvo:cand[0]}); return; }
    res.novos.push(imp);
  });
  return res;
}
function aplicarImportacao(res,contaId){
  res.casados.forEach(({imp,alvo})=>{
    alvo.previsto=false; alvo.valor=imp.valor; alvo.data=imp.data;
    alvo.origem="importado"; if(imp.fitid) alvo.fitid=imp.fitid;
  });
  res.novos.forEach(imp=>{
    S.transacoes.push({id:uid(),tipo:imp.tipo,valor:imp.valor,data:imp.data,
      descricao:imp.descricao,categoriaId:adivinharCategoria(imp.descricao,imp.tipo),
      contaId,status:"efetivada",previsto:false,origem:"importado",fitid:imp.fitid||undefined});
  });
  persist();
}

function modalImportarExtrato(){
  let h=head("Importar extrato do banco");
  h+=`<div class="tiny" style="margin-bottom:14px">Aceita <b>OFX</b> e <b>CSV</b> — os dois saem do
    internet banking em "exportar extrato". O app compara com o que você já lançou: confirma as
    previsões que baterem, cria só o que faltar e ignora o que já existe.</div>`;
  h+=`<div class="field"><label>Entrou em qual conta</label>
    <select id="iConta">${contasAtivas().map(c=>`<option value="${c.id}">${esc(c.nome)} · ${esc(instDe(c))}${c.tipo==="cartao"?" (cartão)":""}</option>`).join("")}</select>
    <div class="help">Os lançamentos entram nessa conta, e portanto nesse banco — o extrato e os gráficos passam a poder filtrar por ele.</div></div>`;
  h+=`<button class="btn" id="iEscolher">Escolher arquivo</button>`;
  h+=`<div class="tiny" style="margin-top:9px;text-align:center">Procure o arquivo <b>.ofx</b>, <b>.csv</b>
    ou <b>.txt</b> que o banco gerou — normalmente fica em Downloads.</div>`;
  h+=`<div id="iPrev"></div>`;
  openModal(h);
  document.getElementById("iEscolher").addEventListener("click",()=>{
    /* Sem "accept": no Android o seletor acinzenta .ofx e .csv, porque esses
       arquivos chegam como tipo desconhecido e não batem com o filtro. */
    const inp=document.createElement("input"); inp.type="file";
    inp.addEventListener("change",()=>{
      const f=inp.files&&inp.files[0]; if(!f) return;
      const fr=new FileReader();
      fr.onerror=()=>{
        document.getElementById("iPrev").innerHTML=
          `<div class="note warn">Não consegui ler <b>${esc(f.name)}</b>. Tente baixar o arquivo
           de novo, ou copie ele para a pasta Downloads antes de escolher.</div>`;
      };
      fr.onload=()=>{
        const txt=decodificar(fr.result);
        const lista=/<OFX|<STMTTRN/i.test(txt)?parseOFX(txt):parseCSV(txt);
        if(!lista.length){
          const ls=txt.split(/\r?\n/).filter(x=>x.trim());
          document.getElementById("iPrev").innerHTML=
            `<div class="note warn"><b>Não reconheci nenhum lançamento nesse arquivo.</b><br>
             Li ${ls.length} linha${ls.length===1?"":"s"} e não achei uma coluna de data com uma de valor.<br>
             <span class="mono" style="font-size:10.5px;opacity:.8">1ª linha: ${esc((ls[0]||"(vazio)").slice(0,70))}</span><br>
             Se puder, me mande esse arquivo que eu ajusto o leitor.</div>`;
          return;
        }
        const contaId=document.getElementById("iConta").value;
        const res=conciliar(lista,contaId);
        let pv=`<div class="note"><span class="mono" style="font-size:10.5px;opacity:.75">${esc(f.name)}</span><br>
          <b>${lista.length}</b> ${lista.length===1?"lançamento lido":"lançamentos lidos"} ·
          ${res.casados.length} conciliados · ${res.novos.length} novos · ${res.dupes.length} já existiam</div>`;
        if(res.casados.length){
          pv+=`<div class="sh" style="padding:16px 0 8px"><h2 style="font-size:.95rem">Confirmam previsões</h2></div>
            <div class="card" style="margin:0">`+res.casados.slice(0,6).map(({imp,alvo})=>
            `<div class="row"><span class="mid"><span class="t1"><span class="nm">${esc(imp.descricao)}</span></span>
             <span class="t2" style="display:block">era previsto ${money(alvo.valor)} em ${fmtData(alvo.data)}</span></span>
             <span class="amt num">${money(imp.valor)}</span></div>`).join("")+`</div>`;
        }
        if(res.novos.length){
          pv+=`<div class="sh" style="padding:16px 0 8px"><h2 style="font-size:.95rem">Entram como novos</h2></div>
            <div class="card" style="margin:0">`+res.novos.slice(0,8).map(imp=>{
            const c=cat(adivinharCategoria(imp.descricao,imp.tipo));
            return `<div class="row"><span class="mid"><span class="t1"><span class="nm">${esc(imp.descricao)}</span></span>
             <span class="t2" style="display:block">${fmtData(imp.data)} · ${esc(c?c.nome:"Outros")}</span></span>
             <span class="amt num ${imp.tipo==="receita"?"pos":"neg"}">${imp.tipo==="receita"?"+":"−"}${money(imp.valor).replace("R$","").trim()}</span></div>`;
          }).join("")+`</div>`;
          if(res.novos.length>8) pv+=`<div class="tiny" style="margin-top:8px">+ ${res.novos.length-8} outros</div>`;
        }
        /* Se o arquivo diz qual era o saldo antes do período, dá para acertar o
           saldo inicial da conta — sem isso o saldo do app nunca bate com o banco. */
        const cta=conta(contaId);
        let sugestao=null;
        if(lista.saldoAntes!==undefined&&cta&&cta.tipo!=="cartao"){
          const datas=lista.map(x=>x.data).sort();
          const antesDoArquivo=r2(vivas().filter(t=>t.contaId===contaId&&t.data<datas[0]&&!ehPrevisto(t))
            .reduce((a,t)=>a+(t.tipo==="receita"?t.valor:t.tipo==="despesa"?-t.valor:0),0));
          const novo=r2(lista.saldoAntes-antesDoArquivo);
          if(Math.abs(novo-(cta.saldoInicial||0))>=0.01) sugestao=novo;
        }
        if(sugestao!==null){
          pv+=`<label class="marcar" style="margin-top:14px"><input type="checkbox" id="iSaldo" checked>
            <span>Ajustar o saldo inicial de <b>${esc(cta.nome)}</b> para <b>${money(sugestao)}</b>,
            que é o que o banco informa nesse arquivo. Hoje está em ${money(cta.saldoInicial||0)}
            — é por isso que o saldo do app não bate com o do banco.</span></label>`;
        }
        pv+=`<button class="btn" id="iAplicar" style="margin-top:${sugestao!==null?"4":"16"}px">Importar ${res.casados.length+res.novos.length} lançamentos</button>`;
        document.getElementById("iPrev").innerHTML=pv;
        document.getElementById("iAplicar").addEventListener("click",()=>{
          const cs=document.getElementById("iSaldo");
          if(cs&&cs.checked&&sugestao!==null){ const c2=conta(contaId); if(c2) c2.saldoInicial=sugestao; }
          aplicarImportacao(res,contaId);
          closeModal(); render();
          toast(`${res.casados.length} confirmados · ${res.novos.length} novos`);
        });
      };
      fr.readAsArrayBuffer(f);
    });
    inp.click();
  });
}

/* ============================ exportar / importar ============================ */
let DL=null;
(async()=>{ try{ DL=await window.claude?.use?.("downloads")||null; }catch(_){ DL=null; } })();

async function baixar(nome,texto,mime){
  if(window.AndroidBridge&&window.AndroidBridge.salvar){
    try{ window.AndroidBridge.salvar(nome,texto); return; }
    catch(e){ toast("Não consegui salvar o arquivo","err"); return; }
  }
  if(DL){
    try{ await DL.save({filename:nome,data:texto}); toast("Arquivo pronto"); return; }
    catch(e){ toast("Download cancelado","err"); return; }
  }
  const blob=new Blob([texto],{type:mime+";charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},500);
  toast("Arquivo gerado");
}
function exportJson(){
  baixar("gestor-backup-"+hoje()+".json",JSON.stringify(S,null,2),"application/json");
}
function exportCsv(){
  const cab=["data","tipo","valor","categoria","conta","descricao","parcela","fatura"];
  const linhas=[cab.join(";")];
  vivas().sort((a,b)=>a.data.localeCompare(b.data)).forEach(t=>{
    const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
    linhas.push([q(t.data),q(t.tipo),q(String(t.valor).replace(".",",")),
      q(cat(t.categoriaId)?.nome||""),q(conta(t.contaId)?.nome||""),q(t.descricao||""),
      q(t.parcelaTotal>1?t.parcelaAtual+"/"+t.parcelaTotal:""),q(t.faturaRef||"")].join(";"));
  });
  baixar("gestor-lancamentos-"+hoje()+".csv","﻿"+linhas.join("\n"),"text/csv");
}
function importar(){
  const inp=document.createElement("input"); inp.type="file"; /* sem accept: ver nota na importação de extrato */
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(String(fr.result));
        if(!d||!Array.isArray(d.transacoes)||!Array.isArray(d.contas)) throw new Error("formato");
        S=Object.assign(seed(),d); persist(); OFFSET=0; closeModal(); render();
        toast("Backup restaurado");
      }catch(e){ toast("Arquivo inválido","err"); }
    };
    fr.readAsText(f);
  });
  inp.click();
}
function zerar(){
  let h=head("Apagar tudo?");
  h+=`<p style="color:var(--ink-soft);font-size:.92rem">Isso remove todos os lançamentos, contas, contas fixas, orçamentos e metas deste aparelho. Não dá para desfazer.</p>`;
  h+=`<button class="btn ghost" id="zBackup">Antes: baixar um backup</button>`;
  h+=`<button class="btn danger" style="margin-top:10px" id="zOk">Apagar tudo</button>`;
  openModal(h);
  document.getElementById("zBackup").addEventListener("click",exportJson);
  document.getElementById("zOk").addEventListener("click",()=>{
    S=seed(); persist(); OFFSET=0; VIEW="resumo"; closeModal(); render(); toast("Tudo apagado");
  });
}

document.getElementById("modal").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-close")) return closeModal();
  if(b.dataset.excluir){
    const t=S.transacoes.find(x=>x.id===b.dataset.excluir); if(!t) return;
    if(t.paiId){ S.transacoes.filter(x=>x.paiId===t.paiId).forEach(x=>x.deletedAt=new Date().toISOString()); }
    else t.deletedAt=new Date().toISOString();
    persist(); closeModal(); render(); toast("Lançamento excluído"); return;
  }
  if(b.dataset.aportar) return modalAporte(b.dataset.aportar);
  if(b.dataset.delmeta){ S.metas=S.metas.filter(m=>m.id!==b.dataset.delmeta); persist(); closeModal(); render(); toast("Meta excluída"); return; }
  if(b.dataset.toggleconta){ const c=conta(b.dataset.toggleconta); c.ativa=!c.ativa; persist(); closeModal(); render(); return; }
  if(b.dataset.delconta){
    const id=b.dataset.delconta;
    if(vivas().some(t=>t.contaId===id||t.contaDestinoId===id||t.cartaoId===id))
      return toast("Tem lançamentos nessa conta — desative em vez de excluir","err");
    S.contas=S.contas.filter(c=>c.id!==id); persist(); closeModal(); render(); toast("Conta excluída"); return;
  }
  if(b.dataset.modal2==="recorrencia") return modalRecorrencia();
  if(b.dataset.editrec) return modalRecorrencia(b.dataset.editrec);
  if(b.dataset.pauserec){
    const r=S.recorrencias.find(x=>x.id===b.dataset.pauserec);
    r.ativa=!r.ativa; if(!r.ativa) limparFuturas(r.id);
    persist(); closeModal(); render(); toast(r.ativa?"Retomada":"Pausada — lançamentos futuros removidos"); return;
  }
  if(b.dataset.delrec){
    const id=b.dataset.delrec;
    limparFuturas(id);
    S.transacoes.filter(t=>t.recorrenciaId===id).forEach(t=>{t.recorrenciaId=null;t.avulso=true;});
    S.recorrencias=S.recorrencias.filter(x=>x.id!==id);
    persist(); closeModal(); render(); toast("Excluída — o histórico foi mantido"); return;
  }
  if(b.dataset.arqcat){ const c=cat(b.dataset.arqcat); c.arquivada=!c.arquivada; persist(); closeModal(); render(); return; }
});

(async function boot(){
  const saved=await load();
  S=saved?Object.assign(seed(),saved):seed();
  if(!S.config) S.config=seed().config;
  if(!S.renda) S.renda=seed().renda;
  if(!Array.isArray(S.recorrencias)) S.recorrencias=[];
  if(!Array.isArray(S.orcamentos)) S.orcamentos=[];

  /* migração: cor hex -> slot da paleta validada; conta sem instituição */
  let migrou=false, migrou2=false;
  if(S.renda.ativa&&!Array.isArray(S.renda.historico)){
    const r=S.renda, cc=contasPag().find(c=>c.tipo==="corrente")||contasPag()[0];
    r.contaId=r.contaId||(cc&&cc.id);
    r.historico=[{desde:refHoje(),bruto:r.bruto,inss:r.inss,irrf:r.irrf,beneficios:r.beneficios,outros:r.outros,
      liquido:r.liquido,diaPagamento:r.diaPagamento||5,contaId:r.contaId,ativa:true}];
    migrou=true;
  }
  S.transacoes.forEach(t=>{ if(t.previsto===undefined){ t.previsto=(t.recorrenciaId?true:t.data>hoje()); migrou2=true; } });
  S.categorias.forEach((c,i)=>{ if(c.slot==null||c.slot>=NSLOT){ c.slot=i%NSLOT; delete c.cor; migrou=true; } });
  S.contas.forEach(c=>{ if(!c.instituicao){ c.instituicao=c.tipo==="carteira"?"Dinheiro":"Sem banco"; migrou=true; } });
  S.contas.forEach(c=>{
    if(c.tipo!=="cartao"||(c.contaPagamentoId&&conta(c.contaPagamentoId))) return;
    const pags=S.contas.filter(x=>x.tipo!=="cartao"&&x.tipo!=="carteira");
    const pg=pags.find(x=>(x.instituicao||"").trim().toLowerCase()===(c.instituicao||"").trim().toLowerCase())
      ||pags.find(x=>x.tipo==="corrente")||pags[0];
    if(pg){ c.contaPagamentoId=pg.id; migrou=true; }
  });
  if(migrou||migrou2) persist();
  aplicaTema();
  render();
  if(!saved) setTimeout(()=>toast("Bem-vindo — comece cadastrando sua renda em Ajustes"),700);
})();
</script>
