<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Controle de gastos, orçamento, metas e cartão de crédito. Seus dados ficam no seu aparelho.">
<meta name="theme-color" content="#2fe08f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08100c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gestor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Gestor Financeiro</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#eef2ef; --surface:#ffffff; --surface-2:#e6f4ec; --sunken:#dfe7e2;
  --ink:#0b1710; --ink-soft:#4e6259; --ink-faint:#7d9187;
  --line:#dce5e0; --line-strong:#c6d5cc;
  --mint:#2fe08f; --on-mint:#07130d; --accent-ink:#0b7a52;
  --warn:#a9601a; --warn-bg:#fbeeda; --warn-line:#e6c68e; --warn-ink:#5c3a10;
  --neg:#b03a2e; --info:#1f6fb2; --surface-3:#f7faf8;
  --r:20px; --rs:16px;
  --shadow:0 1px 2px rgba(11,23,16,.05),0 14px 34px -26px rgba(11,23,16,.45);
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mo:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* forma de pagamento: violeta = crédito, ciano = débito/Pix (slots 6 e 3 da paleta) */
  --cred:#4a3aa7; --cred-bg:#ecebf8; --cred-ink:#3d2f94;
  --deb:#0f9bc4; --deb-bg:#e0f2f7; --deb-ink:#0b5f7a;
  --any-bg:#e6ece8; --any-ink:#3f524a;
  --conta-bg:#e3eefb; --conta-ink:#1f5fae;
  --track:#dfe7e2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#08100c; --surface:#101a15; --surface-2:#12231b; --sunken:#0c1712;
  --ink:#eaf2ee; --ink-soft:#a9c2b8; --ink-faint:#6f9184;
  --line:#1a2a22; --line-strong:#1e3a2c;
  --mint:#2fe08f; --on-mint:#07130d; --accent-ink:#2fe08f;
  --warn:#f0a23c; --warn-bg:#231a10; --warn-line:#4a331a; --warn-ink:#f6d7a8;
  --neg:#ff7a6b; --info:#57b9e0; --surface-3:#0e1512;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -26px #000;
  --cred:#9085e9; --cred-bg:#1c1a33; --cred-ink:#b3abf2;
  --deb:#2299c0; --deb-bg:#0e2530; --deb-ink:#7fcbe6;
  --any-bg:#16241d; --any-ink:#a9c2b8;
  --conta-bg:#12203a; --conta-ink:#8fb8f0;
  --track:#1e3a2c;
}}
:root[data-theme="dark"]{
  --ground:#08100c; --surface:#101a15; --surface-2:#12231b; --sunken:#0c1712;
  --ink:#eaf2ee; --ink-soft:#a9c2b8; --ink-faint:#6f9184;
  --line:#1a2a22; --line-strong:#1e3a2c;
  --mint:#2fe08f; --on-mint:#07130d; --accent-ink:#2fe08f;
  --warn:#f0a23c; --warn-bg:#231a10; --warn-line:#4a331a; --warn-ink:#f6d7a8;
  --neg:#ff7a6b; --info:#57b9e0; --surface-3:#0e1512;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -26px #000;
  --cred:#9085e9; --cred-bg:#1c1a33; --cred-ink:#b3abf2;
  --deb:#2299c0; --deb-bg:#0e2530; --deb-ink:#7fcbe6;
  --any-bg:#16241d; --any-ink:#a9c2b8;
  --conta-bg:#12203a; --conta-ink:#8fb8f0;
  --track:#1e3a2c;
}
/* compatibilidade com componentes antigos */
:root{--accent:var(--accent-ink);--accent-2:var(--accent-ink);--on-accent:var(--on-mint);
  --accent-wash:var(--surface-2);--warn-wash:var(--warn-bg);--pos:var(--accent-ink)}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mo)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;color:inherit;text-align:left}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{max-width:520px;margin:0 auto;padding-bottom:150px;min-height:100vh}
.pad{padding-inline:16px}

/* ---------- topo verde ---------- */
.hero{background:var(--mint);color:var(--on-mint);padding:34px 22px 24px;border-radius:0 0 28px 28px}
.hero .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero .per{font:500 10px/1.3 var(--mo);letter-spacing:.15em;text-transform:uppercase;color:rgba(7,19,13,.62)}
.hero .nav{display:flex;gap:6px;flex:none}
.hero .nav button{width:28px;height:28px;border-radius:99px;background:rgba(7,19,13,.13);
  display:grid;place-items:center;color:var(--on-mint)}
.hero .nav svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hero .cap{margin-top:24px;font:500 11px/1 var(--mo);letter-spacing:.18em;color:rgba(7,19,13,.62)}
.hero .big{font:700 clamp(2.3rem,11vw,2.9rem)/1 var(--ui);letter-spacing:-.04em;margin-top:9px}
.hero .big.neg{color:#7d1d10}
.hero .sub{margin-top:8px;font:500 13px/1.4 var(--ui);color:rgba(7,19,13,.68)}
.hero{cursor:pointer}
.cartaoaviso{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 11px;border-radius:12px;
  background:rgba(7,19,13,.1);font:500 12.5px/1.35 var(--ui);color:rgba(7,19,13,.78)}
.cartaoaviso b{color:var(--on-mint)}
.cartaoaviso svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero .tiles{display:flex;gap:10px;margin-top:20px}
.hero .ir{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;padding:14px 12px;
  background:rgba(7,19,13,.14);border-radius:15px;font:700 11px/1 var(--mo);letter-spacing:.12em;
  text-transform:uppercase;color:var(--on-mint)}
.hero:hover .ir{background:rgba(7,19,13,.22)}
.hero .ir svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.hero .tile{flex:1;background:rgba(7,19,13,.1);border-radius:14px;padding:12px 14px;min-width:0}
.hero .tile .k{font:500 9.5px/1 var(--mo);letter-spacing:.14em;color:rgba(7,19,13,.58)}
.hero .tile .v{font:700 clamp(.95rem,4.4vw,1.06rem)/1 var(--ui);margin-top:6px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* ---------- barra de topo das outras telas ---------- */
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;position:sticky;top:0;z-index:30;
  background:var(--ground)}
.top h1{font-size:1.16rem;flex:1}
.iconbtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--ink-soft);
  border:1px solid var(--line);background:var(--surface);flex:none}
.iconbtn:hover{color:var(--accent-ink);border-color:var(--line-strong)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- alerta ---------- */
.alerts{display:flex;gap:10px;overflow-x:auto;padding:16px 16px 2px;scroll-snap-type:x mandatory;
  scroll-padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.alerts::-webkit-scrollbar{display:none}
.alert{flex:0 0 88%;scroll-snap-align:start;padding:15px 17px;background:var(--warn-bg);
  border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:18px;display:flex;
  align-items:center;gap:14px}
.alert:only-child{flex-basis:100%}
.alert .pc{font:700 24px/1 var(--ui);letter-spacing:-.03em;color:var(--warn);flex:none}
.alert .mid{flex:1;min-width:0}
.alert .t1{display:block;font:700 13.5px/1.25 var(--ui)}
.alert .t2{display:block;font:500 12px/1.35 var(--ui);opacity:.78;margin-top:3px}
.alert .x{font:500 13px/1 var(--mo);opacity:.55;flex:none;align-self:flex-start}
.alertdots{display:flex;justify-content:center;gap:5px;padding:9px 0 0}
.alertdots i{width:5px;height:5px;border-radius:99px;background:var(--warn-line);display:block}

/* ---------- cabeçalho de seção ---------- */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:28px 22px 12px}
.sh h2{font-size:1.12rem}
.sh .act{font:500 10px/1 var(--mo);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}

/* ---------- bento de categorias ---------- */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-inline:16px}
.bcard{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
  min-width:0;display:block;width:100%}
.bcard:hover{border-color:var(--line-strong)}
.bcard .pct{display:flex;font:500 9.5px/1 var(--mo);letter-spacing:.14em;color:var(--ink-faint);align-items:center;gap:6px}
.bcard .pct i{width:7px;height:7px;border-radius:99px;flex:none}
.bcard .nm{display:block;font:600 13.5px/1.2 var(--ui);margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .vl{display:block;font:700 21px/1 var(--ui);margin-top:8px;letter-spacing:-.03em}
.bcard.big{grid-column:span 2;padding:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  background:var(--surface-2);border-color:var(--line-strong)}
.bcard.big .nm{font-size:15px;margin-top:9px}
.bcard.big .vl{font-size:26px;margin:0}
.bcard.wide{grid-column:span 2;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bcard.wide .nm{margin:0;font-size:13.5px}
.bcard.wide .vl{margin:0;font-size:14px;font-weight:600;color:var(--ink-soft)}
.bcard.over{background:var(--warn-bg);border-color:var(--warn-line)}
.bcard.over .pct{color:var(--warn)}
.bcard.over .nm{color:var(--warn-ink)}
.bcard.over .vl{color:var(--warn)}

/* ---------- metas em anel ---------- */
.rings{display:flex;gap:12px;padding-inline:16px;overflow-x:auto;scrollbar-width:none}
.rings::-webkit-scrollbar{display:none}
.ring{flex:0 0 calc(33.333% - 8px);min-width:112px;max-width:160px;padding:18px 12px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  gap:12px;text-align:center;overflow:hidden}
.ring .rtxt{display:block;width:100%;min-width:0}
.ring .dial{width:74px;height:74px;border-radius:99px;display:grid;place-items:center}
.ring .hole{width:56px;height:56px;border-radius:99px;background:var(--surface);display:grid;place-items:center;
  font:700 15px/1 var(--ui)}
.ring .rn{display:block;width:100%;font:600 12.5px/1.25 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring .rs{font:500 9.5px/1.3 var(--mo);color:var(--ink-faint);margin-top:5px;letter-spacing:.04em}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;align-items:flex-end;
  gap:10px;padding:0 12px calc(20px + env(safe-area-inset-bottom));pointer-events:none}
.dock .pill{display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 92%,transparent);
  border:1px solid var(--line-strong);border-radius:999px;padding:7px 9px;backdrop-filter:blur(14px);
  box-shadow:var(--shadow);pointer-events:auto}
.dock .tb{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;color:var(--ink-faint)}
.dock .tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dock .tb span{font:600 11.5px/1 var(--ui);display:none}
.dock .tb[aria-current="page"]{background:var(--mint);color:var(--on-mint)}
.dock .tb[aria-current="page"] span{display:inline}
.fab{width:50px;height:50px;border-radius:99px;background:var(--mint);color:var(--on-mint);display:grid;
  place-items:center;box-shadow:var(--shadow);pointer-events:auto;flex:none}
.fab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}


/* ---------- extrato ---------- */
.exhead{display:flex;align-items:center;gap:14px;padding:18px 20px 10px}
.exhead .volta{width:36px;height:36px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--ink-soft);flex:none}
.exhead .volta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.exhead .per{font:500 10px/1 var(--mo);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.agora{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--line-strong);color:var(--accent-ink);
  font:600 11px/1 var(--ui)}
.exhead h1{font:700 22px/1.1 var(--ui);letter-spacing:-.02em;margin-top:7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exhead .nav{display:flex;gap:6px;flex:none}
.exhead .nav button{width:30px;height:30px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-soft)}
.exhead .nav svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.donutcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 18px 18px;margin:8px 16px 0}
.catlist{display:flex;flex-direction:column;margin-top:20px}
.catrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.catrow .sw{width:9px;height:9px;border-radius:3px;flex:none}
.catrow .cn{flex:1;min-width:0;font:500 13.5px/1.2 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .cv{font:600 13.5px/1 var(--ui);color:var(--ink-soft)}
.catrow .cp{font:500 10.5px/1 var(--mo);color:var(--ink-faint);width:36px;text-align:right}
.catrow.over .cn{color:var(--warn-ink)} .catrow.over .cv{color:var(--warn)} .catrow.over .cp{color:var(--warn)}
.catmore{margin-top:4px;padding:12px 2px 2px;display:flex;align-items:center;justify-content:center;gap:7px;
  border-top:1px solid var(--line);width:100%;font:600 10px/1 var(--mo);letter-spacing:.12em;color:var(--accent-ink)}

.prevbar{margin:12px 16px 0;padding:13px 15px;border-radius:16px;background:var(--warn-bg);
  border:1px solid var(--warn-line);color:var(--warn-ink)}
.prevbar .pb1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  font:600 12.5px/1.3 var(--ui)}
.prevbar .pb1 span{font-family:var(--mo);font-size:11.5px;color:var(--warn);white-space:nowrap}
.prevbar .pb2{font:400 11.5px/1.4 var(--ui);opacity:.72;margin-top:5px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 16px 0}
.tile3{min-width:0;min-height:78px;padding:13px 12px;border-radius:16px;background:var(--surface-3);
  border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.tile3 .k{font:500 8.5px/1.25 var(--mo);letter-spacing:.1em;color:var(--ink-faint)}
.tile3 .v{font:700 14px/1 var(--ui);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chips2{display:flex;gap:7px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{height:34px;padding:0 14px;flex:none;display:flex;align-items:center;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-3);color:var(--ink-soft);
  font:600 12px/1 var(--ui);white-space:nowrap}
.chips2 button[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.searchbox{width:calc(100% - 32px);margin:12px 16px 0;padding:14px 16px;border-radius:16px;
  background:var(--surface-3);border:1px solid var(--line);font:400 13px/1.2 var(--ui)}

.daygroups{display:flex;flex-direction:column;gap:18px;margin:20px 16px 0}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 9px;gap:10px}
.dayhead .d{font:500 9.5px/1 var(--mo);letter-spacing:.16em;color:var(--ink-faint)}
.dayhead .dt{text-align:right;flex:none;display:flex;flex-direction:column;gap:4px}
.dayhead .sal{font:700 13px/1 var(--ui);color:var(--ink);letter-spacing:-.01em}
.dayhead .sal.neg{color:var(--neg)}
.dayhead .mov{font:500 9.5px/1 var(--mo);color:var(--ink-faint)}
.txcard{background:var(--surface-3);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.txrow{display:flex;align-items:stretch;border-top:1px solid var(--line);width:100%}
.txrow:first-child{border-top:0}
.txmain{display:flex;align-items:center;gap:12px;padding:13px 14px;flex:1;min-width:0}
.txmain:hover{background:var(--surface-2)}
.txrow.prev .av,.txrow.prev .tt,.txrow.prev .vl{opacity:.72}
.okbtn{width:46px;flex:none;display:grid;place-items:center;color:var(--ink-faint);
  border-left:1px solid var(--line)}
.okbtn:hover{color:var(--accent-ink);background:var(--surface-2)}
.okbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.prevtag{color:var(--warn)!important;border-color:var(--warn-line)!important}
.txrow .av{width:36px;height:36px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font:700 10.5px/1 var(--mo);color:var(--ink-soft);flex:none}
.txrow .mid{flex:1;min-width:0}
.txrow .l1{display:flex;align-items:center;gap:7px;min-width:0}
.txrow .tt{font:600 13.5px/1.2 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txrow .sb{font:400 11.5px/1.3 var(--ui);color:var(--ink-faint);margin-top:4px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.txrow .vl{font:600 14px/1 var(--ui);flex:none}
.fixotag{font:500 8.5px/1 var(--mo);letter-spacing:.1em;color:var(--accent-ink);border:1px solid var(--line-strong);
  border-radius:4px;padding:3px 5px;flex:none}

/* ---------- listas / cartões genéricos ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;margin-inline:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:15px;
  background:var(--surface-2);position:relative}
.ico .mark{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:99px;
  background:var(--accent-ink);color:var(--ground);font-size:9px;display:grid;place-items:center;
  border:2px solid var(--surface);line-height:1}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:600;font-size:.94rem;display:flex;align-items:center;gap:6px;min-width:0}
.row .t1 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .t2{font-size:.78rem;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:700;font-size:.98rem;flex:none;letter-spacing:-.01em}
.amt.neg{color:var(--neg)} .amt.pos{color:var(--accent-ink)}
.tag{font:700 9px/1.6 var(--mo);letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:5px;flex:none}
.tag.rec{background:var(--surface-2);color:var(--accent-ink)}
.tag.parc{background:var(--sunken);color:var(--ink-soft)}
.tag.prev{background:var(--warn-bg);color:var(--warn)}
.daysep{font:500 10px/1 var(--mo);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);
  padding:13px 15px 7px;border-bottom:1px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--rs);padding:22px 18px;
  text-align:center;color:var(--ink-faint);font-size:.88rem;margin-inline:16px}
.empty b{display:block;color:var(--ink-soft);font-weight:600;margin-bottom:4px;font-size:.95rem}
.tiny{font-size:.78rem;color:var(--ink-faint)}
.sec{margin-top:4px}

/* ---------- progresso ---------- */
.track{height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.bud{padding:14px 15px;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:8px}
.bud .nm{font-weight:600;font-size:.92rem;display:flex;align-items:center;gap:8px;min-width:0}
.bud .vv{font:500 11.5px/1 var(--mo);color:var(--ink-soft);flex:none}
.pct2{font:500 10px/1 var(--mo);margin-top:6px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:8px}
.pct2 .over{color:var(--warn);font-weight:700}
.pct2 .near{color:var(--warn);font-weight:700}
/* orçamento: resumo por forma + grupos */
.orctiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px}
.orctile{text-align:left;padding:12px 11px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;gap:6px;min-width:0}
.orctile[aria-pressed="true"]{border:2px solid var(--fc);padding:11px 10px}
.orctile .k{display:flex;align-items:center;gap:5px;font:700 9.5px/1 var(--mo);letter-spacing:.08em;color:var(--fi);white-space:nowrap}
.orctile .k svg{width:12px;height:12px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.orctile .v{font-weight:700;font-size:1.06rem;letter-spacing:-.02em;line-height:1.1}
.orctile .d{font:500 10px/1.2 var(--mo);color:var(--ink-soft)}
.orctile .d.over{color:var(--warn);font-weight:700}
.orctile.vazio .v{color:var(--ink-faint)}
.orctile .track{height:5px}
.orcgh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:18px 22px 8px;
  font:700 10px/1 var(--mo);letter-spacing:.12em;color:var(--fi)}
.orcgh span:last-child{font-weight:500;letter-spacing:0;color:var(--ink-soft)}
button.bud{display:block;width:100%;text-align:left}
.f-credito{--fc:var(--cred);--fi:var(--cred-ink);--fb:var(--cred-bg)}
.f-debito{--fc:var(--deb);--fi:var(--deb-ink);--fb:var(--deb-bg)}
.f-conta{--fc:var(--accent-ink);--fi:var(--accent-ink);--fb:var(--surface-2)}
.exsel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px}
.exsel .orctile{padding:12px;min-height:96px}
.exsel .orctile[aria-pressed="true"]{padding:11px}
.exsel .orctile .v{font-size:1.15rem}
.exsel .orctile .v.neg{color:var(--neg)}
.anelnota{margin-top:10px;text-align:center;font-size:.78rem;color:var(--ink-soft)}
.anelnota .c1{color:var(--accent-ink)} .anelnota .c2{color:var(--cred-ink)}
.fatcard{margin:10px 16px 0;padding:16px;border-radius:20px;background:color-mix(in srgb,var(--cred) 9%,var(--surface));
  border:1px solid color-mix(in srgb,var(--cred) 32%,transparent)}
.fatcard .f1{display:flex;justify-content:space-between;gap:8px;font:700 10px/1 var(--mo);letter-spacing:.1em;color:var(--cred-ink)}
.fatcard .f1 span:last-child{font-weight:500;letter-spacing:0;color:var(--ink-soft)}
.fatcard .f2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:8px}
.fatcard .fv{font:700 1.75rem/1.1 var(--ui);letter-spacing:-.03em}
.fatcard .fs{font-size:.78rem;color:var(--ink-soft);margin-top:2px}
.fatcard .fpagar{min-height:42px;padding:0 18px;border-radius:12px;background:var(--cred);color:var(--surface);font-weight:700;font-size:.88rem;flex:none}
.fatcard .track{background:color-mix(in srgb,var(--cred) 22%,var(--surface))}
.f-meta{--fc:var(--accent-ink);--fi:var(--accent-ink);--fb:var(--surface-2)}
.pltabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:4px 16px 0}
.pltabs .orctile{padding:12px}
.pltabs .orctile[aria-pressed="true"]{padding:11px}
.pltabs .orctile .v{font-size:1.15rem}
.orcgh .act{font:700 10px/1 var(--mo);letter-spacing:.12em;color:var(--accent-ink);min-height:32px}
.plrow{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
.plrow:last-child{border-bottom:0}
.plring{width:44px;height:44px;border-radius:99px;flex:none;display:grid;place-items:center}
.plring>span{width:34px;height:34px;border-radius:99px;background:var(--surface);display:grid;place-items:center;font-size:16px}
.plring .ini{font:700 13px/1 var(--mo);color:var(--fi)}
.plrow .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.plrow .t1{font-weight:600;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plrow .t2{font:500 11px/1.35 var(--mo);color:var(--ink-soft)}
.plrow .dir{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.plrow .dir b{font:700 13px/1.25 var(--mo)}
.plrow .dir b.warn{color:var(--warn)}
.plrow .dir b.neg{color:var(--neg)}
.plrow .dir span{font:500 10.5px/1.35 var(--mo);color:var(--ink-soft)}
.f-geral{--fc:var(--accent-ink);--fi:var(--any-ink);--fb:var(--any-bg)}
.optf{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;margin-bottom:7px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);text-align:left}
.optf[aria-pressed="true"]{border:2px solid var(--accent-ink);padding:10px 12px}
.optf .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--fb);color:var(--fi)}
.optf .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.optf .tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.optf .tx b{font-size:.95rem}
.optf .tx span{font-size:.8rem;color:var(--ink-soft);line-height:1.35}
.optf .ck{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;flex:none;border:1.5px solid var(--line-strong);color:transparent}
.optf[aria-pressed="true"] .ck{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--surface)}
.catseg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;margin:4px 16px 0;
  background:var(--sunken);border-radius:14px}
.catseg button{min-height:42px;border-radius:11px;font-weight:600;font-size:.88rem;color:var(--ink-soft);text-align:center}
.catseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 16px}
.cattile{min-height:128px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;text-align:center;min-width:0}
.cattile .catcirc{width:52px;height:52px;border-radius:99px;display:grid;place-items:center;font-size:25px;
  background:color-mix(in srgb,var(--cc) 16%,var(--surface));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--cc) 30%,transparent)}
.cattile .cn{font-weight:600;font-size:.82rem;line-height:1.2;overflow-wrap:anywhere}
.cattile .cv{font:500 10.5px/1 var(--mo);color:var(--ink-soft)}
.cattile.arq{opacity:.6}
.catnova{border:1.5px dashed var(--line-strong);background:none;color:var(--accent-ink)}
.catnova .catcirc{background:var(--surface-2);box-shadow:none}
.catnova .catcirc svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.catnova .cn{font-weight:700}
.catarqbtn{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 32px);margin:16px 16px 10px;
  min-height:50px;padding:0 15px;border-radius:16px;border:1px solid var(--line);background:var(--surface-3);font-weight:600;font-size:.9rem;color:var(--ink-soft)}
.catarqbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;transition:transform .2s}
.emojigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:156px;overflow-y:auto;
  padding:8px;border-radius:14px;background:var(--surface-3);border:1px solid var(--line)}
.emojigrid button{height:44px;border-radius:11px;font-size:22px;display:grid;place-items:center}
.emojigrid button[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent-ink)}
.optf .ck svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- faturas ---------- */
.invoice{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:16px;margin:0 16px 10px}
.invoice .i1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.invoice .in{font-weight:700}
.invoice .iv{font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.invoice .i2{font-size:.78rem;color:var(--ink-faint);margin-top:3px}

/* ---------- gráficos ---------- */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 14px;margin:0 16px 12px}
.chart h3{font-size:.98rem;margin:0}
.chart .cs{font-size:.78rem;color:var(--ink-faint);margin:3px 0 0}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.chead>div:first-child{min-width:0}
.kpi{text-align:right;flex:none}
.kpi .kv{display:block;font:700 17px/1 var(--ui);letter-spacing:-.02em;color:var(--accent-ink);
  max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.neg .kv{color:var(--warn)}
.kpi .kl{display:block;font:500 8.5px/1 var(--mo);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:5px}
.chartvazio{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 10px;text-align:center;
  color:var(--ink-faint);font-size:.85rem}
.chartvazio svg{width:48px;height:30px;fill:var(--line-strong)}
.segper{display:inline-flex;gap:3px;background:var(--sunken);border-radius:11px;padding:3px;margin:12px 16px 14px}
.segper button{padding:7px 14px;border-radius:9px;font:600 11.5px/1 var(--ui);color:var(--ink-faint)}
.segper button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.leg{display:flex;flex-direction:column;margin-top:12px}
.legitem{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:.87rem}
.legitem .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legitem .lv{font:500 11.5px/1 var(--mo);color:var(--ink-soft)}
.legitem .lp{font:500 11px/1 var(--mo);color:var(--ink-faint);width:34px;text-align:right}
.legrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.8rem;color:var(--ink-soft)}
.legrow span{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:99px;flex:none;display:inline-block}
.donutcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;margin:0 16px}

/* ---------- bancos ---------- */
.bankcard{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);width:100%}
.bankcard:last-child{border-bottom:0}
.bankcard .bi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-weight:700;font-size:13px;background:var(--surface-2)}
.bankcard .mid{flex:1;min-width:0}
.bankcard .t1{font-weight:600;font-size:.93rem}
.bankcard .t2{font-size:.77rem;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bankcard .bs{font-weight:700;font-size:1.02rem;white-space:nowrap;letter-spacing:-.02em}

/* ---------- filtros ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:8px 16px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button,.filters select{white-space:nowrap;padding:8px 13px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);font-size:.82rem;color:var(--ink-soft)}
.filters button[aria-pressed="true"]{border-color:var(--accent-ink);color:var(--accent-ink);
  background:var(--surface-2);font-weight:600}
.search{width:calc(100% - 32px);margin:10px 16px 0;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;font-size:16px}

/* ---------- ajustes ---------- */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);width:100%}
.setrow:last-child{border-bottom:0}
.setrow .mid{flex:1;min-width:0}
.setrow .t1{font-weight:600;font-size:.92rem}
.setrow .t2{font-size:.77rem;color:var(--ink-faint)}
.setrow svg.chev{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;color:var(--ink-faint);flex:none}
/* ajustes: hub em blocos */
.ajhero{display:flex;justify-content:space-between;align-items:flex-end;width:calc(100% - 32px);margin:4px 16px 0;
  padding:16px;border-radius:20px;background:var(--mint);color:var(--on-mint);text-align:left;min-height:110px}
.ajhero .k{font:500 10.5px/1 var(--mo);letter-spacing:.14em;color:rgba(7,19,13,.7)}
.ajhero .v{display:block;font:700 2rem/1.1 var(--ui);letter-spacing:-.04em;margin-top:6px}
.ajhero .s{display:block;font-size:.8rem;color:rgba(7,19,13,.72);margin-top:2px}
.ajhero svg,.ajtile svg.chev{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;flex:none}
.ajgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px 16px 0}
.ajtile{display:flex;flex-direction:column;gap:12px;min-height:150px;padding:15px;border-radius:20px;text-align:left;
  background:var(--surface);border:1px solid var(--line)}
.ajtile .ic,.ajic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--tb);color:var(--ti)}
.ajtile .ic svg,.ajic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ajtile .sp{flex:1}
.ajtile .t1{display:block;font-weight:700;font-size:.95rem}
.ajtile .t2{display:block;font-size:.8rem;color:var(--ink-soft)}
.t-conta{--tb:var(--conta-bg);--ti:var(--conta-ink)}
.t-fixa{--tb:var(--warn-bg);--ti:var(--warn)}
.t-cat{--tb:var(--any-bg);--ti:var(--any-ink)}
.t-dados{--tb:var(--deb-bg);--ti:var(--deb-ink)}
.t-cred{--tb:var(--cred-bg);--ti:var(--cred-ink)}
.t-perigo{--tb:var(--warn-bg);--ti:var(--neg)}
.temaseg{display:flex;gap:2px;padding:3px;background:var(--sunken);border-radius:10px;flex:none}
.temaseg button{min-height:34px;padding:0 10px;border-radius:8px;font:600 12px/1 var(--ui);color:var(--ink-soft)}
.temaseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ajsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:4px 16px 0;padding:16px;
  border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.ajsum .k{font:500 10px/1 var(--mo);letter-spacing:.12em;color:var(--ink-soft)}
.ajsum .v{font:700 1.38rem/1.1 var(--ui);letter-spacing:-.03em;margin-top:6px}
.ajgh{padding:20px 22px 8px;font:700 10px/1 var(--mo);letter-spacing:.12em;color:var(--ink-soft)}
.ajadd{display:block;width:calc(100% - 32px);margin:16px 16px 0;min-height:52px;border-radius:16px;
  border:1px dashed var(--line-strong);font-weight:600;font-size:.92rem;color:var(--accent-ink);text-align:center}
.setrow .amt2{font-weight:700;white-space:nowrap}
.cardlim{display:block;width:100%;margin-top:8px}
.cardlim .pct2{display:flex}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,10,7,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:26px 26px 0 0;padding:16px 18px calc(26px + env(safe-area-inset-bottom));
  border:1px solid var(--line-strong);border-bottom:0}
.sheet::-webkit-scrollbar{display:none}
.sheet{scrollbar-width:none}
@media(min-width:560px){.scrim{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line);max-height:86vh}}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheethead h2{flex:1;font-size:1.14rem}
.grab{width:36px;height:4px;background:var(--line-strong);border-radius:99px;margin:0 auto 14px}
.field{margin-bottom:13px}
.field label{display:block;font:500 10px/1 var(--mo);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--surface-3);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;font-size:16px}
.field select{appearance:none;-webkit-appearance:none;padding-right:38px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237d9187' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;background-size:15px}
:root[data-theme="dark"] .field select,
:root:not([data-theme="light"]) .field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236f9184' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>")}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-ink);outline:none}
.field .help{font-size:.76rem;color:var(--ink-faint);margin-top:5px}
.marcar{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:14px;
  background:var(--surface-3);border:1px solid var(--line);margin-bottom:13px;font-size:.85rem;
  color:var(--ink-soft);cursor:pointer}
.marcar input{width:19px;height:19px;flex:none;margin:0;accent-color:var(--mint)}
.marcar b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount{border:1px solid var(--line)!important;background:var(--surface-3)!important;border-radius:18px!important;
  text-align:center;font-weight:700!important;font-size:2.1rem!important;padding:22px 12px!important;
  letter-spacing:-.035em;color:var(--ink)!important}
.amount:focus{border-color:var(--mint)!important}
.amount.pos{color:var(--accent-ink)!important}
.amount.neg{color:var(--ink)!important}
.seg{display:grid;grid-auto-flow:column;background:var(--sunken);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:11px 6px;border-radius:11px;font-size:.86rem;font-weight:600;color:var(--ink-faint);text-align:center}
.seg button[aria-pressed="true"]{background:var(--mint);color:var(--on-mint)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:9px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface-3);
  font-size:.85rem;display:flex;align-items:center;gap:6px;color:var(--ink-soft)}
.chips button[aria-pressed="true"]{border-color:var(--mint);background:var(--mint);
  color:var(--on-mint);font-weight:600}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--mint);color:var(--on-mint);
  font-weight:700;font-size:1rem;margin-top:8px;text-align:center}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);font-weight:600}

  padding:12px 14px;font-size:.84rem;margin-top:12px}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.note b{color:var(--ink)}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;display:flex;
  flex-direction:column-reverse;gap:8px;align-items:center;pointer-events:none;width:100%;max-width:520px;padding:0 16px}

  font-weight:600;box-shadow:var(--shadow);max-width:100%;text-align:center}
.toast.err{background:var(--neg);color:#fff}
</style>

<script>
"use strict";
/* ============================ persistência (IndexedDB) ============================ */
const DB="gestorfin", STORE="kv", KEY="state";
let _db=null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    if(!("indexedDB" in window)) return rej(new Error("sem indexedDB"));
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
    r.onsuccess=()=>{_db=r.result;res(_db)};
    r.onerror=()=>rej(r.error);
  });
}
async function load(){
  try{
    const db=await idb();
    return await new Promise((res,rej)=>{
      const t=db.transaction(STORE,"readonly").objectStore(STORE).get(KEY);
      t.onsuccess=()=>res(t.result||null); t.onerror=()=>rej(t.error);
    });
  }catch(e){
    try{ const s=localStorage.getItem(DB); return s?JSON.parse(s):null; }catch(_){ return null; }
  }
}
async function save(st){
  try{
    const db=await idb();
    await new Promise((res,rej)=>{
      const t=db.transaction(STORE,"readwrite").objectStore(STORE).put(st,KEY);
      t.onsuccess=()=>res(); t.onerror=()=>rej(t.error);
    });
  }catch(e){
    try{ localStorage.setItem(DB,JSON.stringify(st)); }
    catch(_){ toast("Não consegui salvar neste navegador","err"); }
  }
}
let saveT=null;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>save(S),180); }

/* ============================ utilidades ============================ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=v=>BRL.format(v||0);
const eixo=v=>{
  const a=Math.abs(v);
  if(a===0) return "0";
  if(a>=1000000) return (v/1000000).toFixed(a>=10000000?0:1).replace(".",",")+"M";
  if(a>=1000) return (v/1000).toFixed(a>=10000?0:1).replace(".",",")+"k";
  return String(Math.round(v));
};
const moneyShort=v=>{const a=Math.abs(v); if(a>=1000000)return (v/1000000).toFixed(1).replace(".",",")+"M"; if(a>=10000)return (v/1000).toFixed(0)+"k"; return BRL.format(v||0);};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseISO=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const hoje=()=>iso(new Date());
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const fmtData=s=>{const d=parseISO(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()};
const fmtDia=s=>{const d=parseISO(s);const h=hoje();
  if(s===h) return "HOJE · "+pad(d.getDate())+" "+MESES[d.getMonth()].slice(0,3).toUpperCase();
  const y=new Date();y.setDate(y.getDate()-1);
  if(s===iso(y)) return "ONTEM · "+pad(d.getDate())+" "+MESES[d.getMonth()].slice(0,3).toUpperCase();
  return pad(d.getDate())+" DE "+MESES[d.getMonth()].toUpperCase();};
const iniciais=t=>{const w=(t||"").trim().split(/\s+/).filter(Boolean);
  if(!w.length) return "··";
  return (w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase();};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;

function toast(msg,kind){
  const el=document.createElement("div");
  el.className="toast"+(kind==="err"?" err":""); el.textContent=msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

/* ============================ estado inicial ============================ */
/* Paleta categórica das DESPESAS — 6 hues, validada nos dois temas.
   Verde e vermelho ficam de fora de propósito: verde é reservado para entradas
   e vermelho para saídas/negativo, então nenhuma categoria pode usá-los. */
const PAL_L=["#2a78d6","#eb6834","#0f9bc4","#eda100","#e87ba4","#4a3aa7"];
const PAL_D=["#3987e5","#d95926","#2299c0","#c98500","#d55181","#9085e9"];
const SERIE_ENTRA_L="#1baf7a", SERIE_SAI_L="#e34948";
const SERIE_ENTRA_D="#199e70", SERIE_SAI_D="#e66767";
function escuro(){
  const t=document.documentElement.getAttribute("data-theme");
  if(t==="dark") return true; if(t==="light") return false;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
}
const PALETA=()=>escuro()?PAL_D:PAL_L;
const NSLOT=6;
const slotCor=i=>PALETA()[((i|0)%NSLOT+NSLOT)%NSLOT];
const corSerie=k=>escuro()?(k==="entra"?SERIE_ENTRA_D:SERIE_SAI_D):(k==="entra"?SERIE_ENTRA_L:SERIE_SAI_L);
const PAL=PAL_L;
function seed(){
  const catD=[["Moradia","🏠"],["Mercado","🛒"],["Transporte","🚗"],["Alimentação fora","🍽️"],["Saúde","💊"],
    ["Educação","📚"],["Lazer","🎬"],["Assinaturas","📺"],["Vestuário","👕"],["Impostos e taxas","🧾"],["Outros","•"]];
  const catR=[["Salário","💼"],["Freelance","💻"],["Reembolso","↩️"],["Rendimentos","📈"],["Outros","•"]];
  const cats=[];
  catD.forEach((c,i)=>cats.push({id:uid(),nome:c[0],icone:c[1],tipo:"despesa",slot:i%NSLOT,arquivada:false}));
  catR.forEach((c,i)=>cats.push({id:uid(),nome:c[0],icone:c[1],tipo:"receita",slot:0,arquivada:false}));
  return {
    versao:1,
    config:{perfil:"Pessoal",cicloMes:"calendario",diaInicio:1,tema:"auto"},
    renda:{bruto:0,inss:0,irrf:0,beneficios:0,outros:0,liquido:0,diaPagamento:5,ativa:false},
    contas:[
      {id:uid(),nome:"Conta corrente",tipo:"corrente",instituicao:"Meu banco",saldoInicial:0,ativa:true},
      {id:uid(),nome:"Carteira",tipo:"carteira",instituicao:"Dinheiro",saldoInicial:0,ativa:true}
    ],
    categorias:cats,
    transacoes:[], orcamentos:[], metas:[], recorrencias:[]
  };
}

let S=null, VIEW="resumo", OFFSET=0;

/* ============================ período / ciclo do mês ============================ */
function periodo(off){
  const cfg=S.config, base=new Date(); base.setHours(0,0,0,0);
  if(cfg.cicloMes==="calendario"){
    const ini=new Date(base.getFullYear(),base.getMonth()+off,1);
    const fim=new Date(ini.getFullYear(),ini.getMonth()+1,0);
    return {ini,fim,ref:ini.getFullYear()+"-"+pad(ini.getMonth()+1),
      rotulo:cap(MESES[ini.getMonth()])+" de "+ini.getFullYear(),
      sub:pad(1)+"/"+pad(ini.getMonth()+1)+" – "+pad(fim.getDate())+"/"+pad(fim.getMonth()+1)};
  }
  const dia=clamp(cfg.diaInicio||1,1,28);
  let y=base.getFullYear(), m=base.getMonth();
  if(base.getDate()<dia) m-=1;
  const ini=new Date(y,m+off,dia);
  const fim=new Date(ini.getFullYear(),ini.getMonth()+1,dia-1);
  return {ini,fim,ref:ini.getFullYear()+"-"+pad(ini.getMonth()+1),
    rotulo:cap(MESES[ini.getMonth()])+" de "+ini.getFullYear(),
    sub:pad(ini.getDate())+"/"+pad(ini.getMonth()+1)+" – "+pad(fim.getDate())+"/"+pad(fim.getMonth()+1)};
}
const dentro=(s,p)=>{const d=parseISO(s);return d>=p.ini&&d<=p.fim};

/* ============================ consultas ============================ */
const vivas=()=>S.transacoes.filter(t=>!t.deletedAt);
/* Um lançamento é "previsto" enquanto for expectativa: conta fixa que ainda não
   foi confirmada, ou qualquer coisa com data no futuro. Quando o Open Finance
   entrar, é isto que a conciliação vai virar em "realizado". */
const ehPrevisto=t=>t.previsto===true||(t.previsto===undefined&&t.data>hoje());
const realizadas=()=>vivas().filter(t=>!ehPrevisto(t));
const conta=id=>S.contas.find(c=>c.id===id);
const cat=id=>S.categorias.find(c=>c.id===id);
const catCor=c=>!c?"var(--ink-faint)":c.tipo==="receita"?corSerie("entra"):slotCor(c.slot!=null?c.slot:0);
const contasAtivas=()=>S.contas.filter(c=>c.ativa);
const contasPag=()=>S.contas.filter(c=>c.ativa&&c.tipo!=="cartao");
const cartoes=()=>S.contas.filter(c=>c.ativa&&c.tipo==="cartao");

/* RN01 — saldo de conta (cartão não tem saldo) */
function saldo(id){
  const c=conta(id); if(!c||c.tipo==="cartao") return 0;
  let s=c.saldoInicial||0; const h=hoje();
  vivas().forEach(t=>{
    if(t.data>h||ehPrevisto(t)) return;
    if(t.tipo==="receita"&&t.contaId===id) s+=t.valor;
    else if(t.tipo==="despesa"&&t.contaId===id) s-=t.valor;
    else if(t.tipo==="transferencia"){ if(t.contaId===id) s-=t.valor; if(t.contaDestinoId===id) s+=t.valor; }
    else if(t.tipo==="pagfatura"&&t.contaId===id) s-=t.valor;
  });
  return r2(s);
}
const saldoTotal=()=>r2(contasPag().reduce((a,c)=>a+saldo(c.id),0));

/* RN03 — fatura a que uma compra pertence */
function faturaDe(cartao,dataStr){
  const d=parseISO(dataStr); const fech=clamp(cartao.diaFechamento||1,1,28);
  let y=d.getFullYear(), m=d.getMonth();
  if(d.getDate()>fech) m+=1;
  const ref=new Date(y,m,1);
  return ref.getFullYear()+"-"+pad(ref.getMonth()+1);
}
function vencimentoFatura(cartao,ref){
  const [y,m]=ref.split("-").map(Number);
  const fech=clamp(cartao.diaFechamento||1,1,28), venc=clamp(cartao.diaVencimento||10,1,28);
  const mm=venc>fech?m-1:m;
  return iso(new Date(y,mm,venc));
}
function faturaTotal(cartaoId,ref){
  return r2(vivas().filter(t=>t.tipo==="despesa"&&t.contaId===cartaoId&&t.faturaRef===ref)
    .reduce((a,t)=>a+t.valor,0));
}
function faturaPago(cartaoId,ref){
  return r2(vivas().filter(t=>t.tipo==="pagfatura"&&t.cartaoId===cartaoId&&t.faturaRef===ref)
    .reduce((a,t)=>a+t.valor,0));
}
function usoCartao(cartaoId){
  return Math.max(0,r2(vivas().filter(t=>t.tipo==="despesa"&&t.contaId===cartaoId).reduce((a,t)=>a+t.valor,0)
    - vivas().filter(t=>t.tipo==="pagfatura"&&t.cartaoId===cartaoId).reduce((a,t)=>a+t.valor,0)));
}

/* ---------- instituições (bancos) ---------- */
/* O cartão não é um banco: ele pertence à conta que paga a fatura e herda o
   banco dela. Assim nunca aparece sozinho em "Seus bancos" nem no filtro. */
const contaPagadora=c=>c&&c.tipo==="cartao"?conta(c.contaPagamentoId):null;
function instDe(c){
  if(!c) return "Sem banco";
  if(c.tipo==="cartao"){ const pg=contaPagadora(c); return pg?instDe(pg):"Sem banco"; }
  return (c.instituicao||"Sem banco").trim()||"Sem banco";
}
function instituicoes(){
  const m=new Map();
  contasAtivas().forEach(c=>{ const k=instDe(c);
    if(!m.has(k)) m.set(k,[]); m.get(k).push(c); });
  return [...m.entries()].map(([nome,contas])=>({nome,contas,
    saldo:r2(contas.filter(c=>c.tipo!=="cartao").reduce((a,c)=>a+saldo(c.id),0)),
    cartao:r2(contas.filter(c=>c.tipo==="cartao").reduce((a,c)=>a+usoCartao(c.id),0))}));
}
const contaNaInst=(id,inst)=>{ if(!inst) return true; const c=conta(id);
  return !!c&&instDe(c)===inst; };
function txDaInst(t,inst){
  if(!inst) return true;
  return contaNaInst(t.contaId,inst)||(t.contaDestinoId&&contaNaInst(t.contaDestinoId,inst));
}

/* gastos e entradas do período — RN02: transferência e pagamento de fatura não contam */
function gastosRealizados(p){ return r2(realizadas().filter(t=>t.tipo==="despesa"&&dentro(t.data,p)).reduce((a,t)=>a+t.valor,0)); }
function entradasRealizadas(p){ return r2(realizadas().filter(t=>t.tipo==="receita"&&dentro(t.data,p)).reduce((a,t)=>a+t.valor,0)); }
function previstosPeriodo(p,inst){
  const ts=vivas().filter(t=>ehPrevisto(t)&&dentro(t.data,p)&&txDaInst(t,inst));
  return {sai:r2(ts.filter(t=>t.tipo==="despesa").reduce((a,t)=>a+t.valor,0)),
          entra:r2(ts.filter(t=>t.tipo==="receita").reduce((a,t)=>a+t.valor,0)),
          n:ts.length};
}
function gastosPeriodo(p){ return r2(vivas().filter(t=>t.tipo==="despesa"&&dentro(t.data,p)).reduce((a,t)=>a+t.valor,0)); }
function entradasPeriodo(p){ return r2(vivas().filter(t=>t.tipo==="receita"&&dentro(t.data,p)).reduce((a,t)=>a+t.valor,0)); }
function aportesPeriodo(p){
  return r2(S.metas.filter(m=>m.status!=="concluida").reduce((a,m)=>a+aporteSugerido(m),0));
}
/* Regime de caixa: o que sai da conta no período. Débito, Pix e dinheiro saem
   na data; compra no cartão sai no mês em que a fatura vence. Fatura paga antes
   do vencimento pesa no mês do pagamento, e o mês do vencimento conta só o resto. */
function faturasDe(cartaoId){
  const refs=new Set();
  vivas().forEach(t=>{ if(t.faturaRef&&((t.tipo==="despesa"&&t.contaId===cartaoId)||(t.tipo==="pagfatura"&&t.cartaoId===cartaoId))) refs.add(t.faturaRef); });
  return [...refs];
}
function saidaCaixa(p){
  let s=vivas().filter(t=>t.tipo==="despesa"&&dentro(t.data,p)&&conta(t.contaId)?.tipo!=="cartao").reduce((a,t)=>a+t.valor,0);
  S.contas.filter(c=>c.tipo==="cartao").forEach(c=>faturasDe(c.id).forEach(ref=>{
    const venc=vencimentoFatura(c,ref), pags=vivas().filter(t=>t.tipo==="pagfatura"&&t.cartaoId===c.id&&t.faturaRef===ref);
    if(dentro(venc,p)){
      const antes=pags.filter(t=>parseISO(t.data)<p.ini).reduce((a,t)=>a+t.valor,0);
      s+=Math.max(0,faturaTotal(c.id,ref)-antes);
    }else if(parseISO(venc)>p.fim){
      s+=pags.filter(t=>dentro(t.data,p)).reduce((a,t)=>a+t.valor,0);
    }
  }));
  return r2(s);
}
/* compras no cartão feitas no período que só vão pesar em meses seguintes */
function cartaoAdiante(p){
  let v=0, vencs=new Set();
  vivas().forEach(t=>{ const c=conta(t.contaId);
    if(t.tipo!=="despesa"||!dentro(t.data,p)||c?.tipo!=="cartao"||!t.faturaRef) return;
    const venc=vencimentoFatura(c,t.faturaRef); if(parseISO(venc)<=p.fim) return;
    v+=t.valor; vencs.add(venc); });
  return {valor:r2(v),vencs:[...vencs].sort()};
}
/* RN09 — só o dinheiro de verdade */
function podeGastar(p){
  const rendaPrev=(rendaEm(p.ref)||{}).liquido||0;
  const receitas=entradasPeriodo(p);
  const base=Math.max(rendaPrev,receitas)||receitas;
  return r2(base - saidaCaixa(p) - aportesPeriodo(p));
}
/* RN07 */
function aporteSugerido(m){
  if(m.status==="concluida") return 0;
  const falta=Math.max(0,(m.alvo||0)-(m.acumulado||0));
  if(falta<=0) return 0;
  if(!m.prazo) return 0;
  const hj=new Date(); hj.setHours(0,0,0,0);
  const pz=parseISO(m.prazo);
  let meses=(pz.getFullYear()-hj.getFullYear())*12+(pz.getMonth()-hj.getMonth());
  if(pz.getDate()>=hj.getDate()) meses+=0; 
  meses=Math.max(1,meses);
  return r2(falta/meses);
}
function metaAtrasada(m){
  if(!m.prazo||m.status==="concluida") return false;
  return parseISO(m.prazo)<new Date(new Date().setHours(0,0,0,0)) && (m.acumulado||0)<(m.alvo||0);
}

/* ============================ F13 — recorrências ============================ */
const FREQS=[
  {v:"1m",unidade:"mes",intervalo:1,label:"Todo mês"},
  {v:"2m",unidade:"mes",intervalo:2,label:"A cada 2 meses"},
  {v:"3m",unidade:"mes",intervalo:3,label:"A cada 3 meses"},
  {v:"6m",unidade:"mes",intervalo:6,label:"A cada 6 meses"},
  {v:"12m",unidade:"mes",intervalo:12,label:"Uma vez por ano"},
  {v:"1s",unidade:"semana",intervalo:1,label:"Toda semana"},
  {v:"2s",unidade:"semana",intervalo:2,label:"A cada 2 semanas"}
];
const freqDe=v=>FREQS.find(f=>f.v===v)||FREQS[0];
function labelFreq(r){
  const f=freqDe(r.freq);
  if(f.unidade==="semana") return f.label+", "+DIAS[parseISO(r.dataInicio).getDay()];
  return f.label+", dia "+r.dia;
}
/* datas em que a recorrência cai, do início até `ate` */
function ocorrencias(r,ate){
  const out=[], ini=parseISO(r.dataInicio), fim=r.dataFim?parseISO(r.dataFim):null;
  const f=freqDe(r.freq);
  if(f.unidade==="semana"){
    let d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate());
    let g=0;
    while(d<=ate&&g++<800){
      if(!fim||d<=fim) out.push(iso(d));
      d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7*f.intervalo);
    }
  }else{
    const dia=clamp(r.dia||ini.getDate(),1,31);
    for(let k=0;k<800;k++){
      const mm=ini.getMonth()+k*f.intervalo;
      const ultimo=new Date(ini.getFullYear(),mm+1,0).getDate();
      const d=new Date(ini.getFullYear(),mm,Math.min(dia,ultimo));
      if(d>ate) break;
      if(d>=ini&&(!fim||d<=fim)) out.push(iso(d));
    }
  }
  return out;
}
/* cria os lançamentos que faltam, sem nunca duplicar nem ressuscitar excluídos */
/* ---------- salário ----------
   O salário vira uma receita de verdade todo mês, no dia do pagamento, na conta
   escolhida — é isso que faz ele aparecer em "Entrou" e no saldo. O valor vem de
   um histórico: cada alteração vale a partir de um mês (`desde`), então os meses
   passados nunca mudam. Um salário editado à mão (bônus, desconto) é preservado. */
const refMes=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const refHoje=()=>refMes(new Date());
const refSoma=(ref,n)=>{ const [y,m]=ref.split("-").map(Number); return refMes(new Date(y,m-1+n,1)); };
const rotuloRef=ref=>{ const [y,m]=ref.split("-").map(Number); return MESES[m-1]+" de "+y; };
function rendaEm(ref){
  const h=(S.renda&&S.renda.historico)||[];
  let e=null; h.forEach(x=>{ if(x.desde<=ref) e=x; });
  return e&&e.ativa!==false?e:null;
}
function catSalario(){
  return acharCat("Salário","receita")||(S.categorias.find(c=>c.tipo==="receita"&&!c.arquivada)||{}).id;
}
function materializarSalario(){
  const hist=(S.renda&&S.renda.historico)||[]; if(!hist.length) return false;
  const pa=periodo(OFFSET).fim, pb=periodo(0).fim, ate=refMes(pa>pb?pa:pb);
  const porRef=new Map(S.transacoes.filter(t=>t.salarioRef).map(t=>[t.salarioRef,t]));
  let mudou=false;
  for(let ref=hist[0].desde, g=0; ref<=ate&&g<600; ref=refSoma(ref,1), g++){
    const e=rendaEm(ref); if(!e||porRef.has(ref)) continue;
    const ct=conta(e.contaId)||contasPag()[0]; if(!ct) continue;
    const [y,m]=ref.split("-").map(Number);
    const ult=new Date(y,m,0).getDate();
    const data=iso(new Date(y,m-1,Math.min(e.diaPagamento||5,ult)));
    S.transacoes.push({id:uid(),tipo:"receita",valor:e.liquido,data,descricao:"Salário",
      categoriaId:catSalario(),contaId:ct.id,status:"efetivada",previsto:data>hoje(),salarioRef:ref,origem:"salario"});
    mudou=true;
  }
  /* chegou o dia do pagamento: o salário entra no saldo sozinho */
  const h=hoje();
  S.transacoes.forEach(t=>{ if(t.salarioRef&&!t.deletedAt&&t.previsto&&!t.editado&&t.data<=h){ t.previsto=false; mudou=true; } });
  return mudou;
}
/* troca o salário a partir de `desde`: os lançamentos intocados desse mês em
   diante saem e são recriados com o valor novo; meses anteriores ficam como estão */
function aplicarRenda(entrada){
  const r=S.renda;
  r.historico=(r.historico||[]).filter(x=>x.desde<entrada.desde);
  r.historico.push(entrada);
  S.transacoes=S.transacoes.filter(t=>!(t.salarioRef&&t.salarioRef>=entrada.desde&&!t.editado));
  const atual=rendaEm(refHoje())||entrada;
  Object.assign(r,{bruto:atual.bruto||0,inss:atual.inss||0,irrf:atual.irrf||0,beneficios:atual.beneficios||0,
    outros:atual.outros||0,liquido:atual.liquido||0,diaPagamento:atual.diaPagamento||5,contaId:atual.contaId,
    ativa:entrada.ativa!==false||!!rendaEm(refHoje())});
}

function materializar(){
  if(materializarSalario()) persist();
  if(!S.recorrencias||!S.recorrencias.length) return false;
  const pa=periodo(OFFSET).fim, pb=periodo(0).fim;
  const ate=pa>pb?pa:pb;
  const jaExiste=new Set(S.transacoes.filter(t=>t.recorrenciaId).map(t=>t.recorrenciaId+"@"+t.data));
  let novos=0;
  S.recorrencias.filter(r=>r.ativa).forEach(r=>{
    const c=conta(r.contaId); if(!c) return;
    ocorrencias(r,ate).forEach(d=>{
      const k=r.id+"@"+d; if(jaExiste.has(k)) return;
      jaExiste.add(k); novos++;
      S.transacoes.push({id:uid(),tipo:r.tipo,valor:r.valor,data:d,descricao:r.descricao,
        categoriaId:r.categoriaId,contaId:r.contaId,status:"efetivada",previsto:true,recorrenciaId:r.id,
        faturaRef:(c.tipo==="cartao"&&r.tipo==="despesa")?faturaDe(c,d):undefined});
    });
  });
  if(novos) persist();
  return novos>0;
}
/* ao editar ou pausar: remove as ocorrências futuras ainda intocadas */
function limparFuturas(recId){
  const h=hoje();
  S.transacoes=S.transacoes.filter(t=>!(t.recorrenciaId===recId&&t.data>h&&!t.deletedAt&&!t.editado));
}
function fixosDoPeriodo(p){
  return vivas().filter(t=>t.recorrenciaId&&dentro(t.data,p))
    .sort((a,b)=>a.data.localeCompare(b.data));
}

/* ============================ gráficos (SVG à mão) ============================ */
const TAU=Math.PI*2;
const pol=(cx,cy,r,a)=>[cx+r*Math.cos(a-Math.PI/2),cy+r*Math.sin(a-Math.PI/2)];
function arco(cx,cy,re,ri,a0,a1){
  const [x0,y0]=pol(cx,cy,re,a0),[x1,y1]=pol(cx,cy,re,a1);
  const [x2,y2]=pol(cx,cy,ri,a1),[x3,y3]=pol(cx,cy,ri,a0);
  const g=(a1-a0)>Math.PI?1:0;
  return `M${x0} ${y0}A${re} ${re} 0 ${g} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${g} 0 ${x3} ${y3}Z`;
}

/* Um setor do anel. Cobrindo 360°, um arco começaria e terminaria no mesmo
   ponto e não pintaria nada — nesse caso vira um círculo com traço. */
function setor(cx,cy,re,ri,a0,a1,fill,extra){
  const span=a1-a0;
  if(span<=0.0004) return "";
  if(span>=TAU-0.0008)
    return `<circle cx="${cx}" cy="${cy}" r="${(re+ri)/2}" fill="none" stroke="${fill}"
      stroke-width="${re-ri}" ${extra||""}/>`;
  return `<path d="${arco(cx,cy,re,ri,a0,a1)}" fill="${fill}" ${extra||""}/>`;
}
/* dados: [{nome, valor, cor}] já ordenados. Dobra o excedente em "Outros". */
function dobrar(itens,max){
  if(itens.length<=max) return itens;
  const cab=itens.slice(0,max-1);
  const resto=itens.slice(max-1);
  cab.push({nome:"Outros",valor:r2(resto.reduce((a,x)=>a+x.valor,0)),cor:"var(--ink-faint)",resto:resto.length});
  return cab;
}
function donutGastos(itens,total,entrou,split){
  const W=240,cx=120,cy=120,re=107,ri=75;
  const pcEnt=entrou>0?Math.round(total/entrou*100):null;
  let corpo;
  if(!total){
    corpo=`<circle cx="${cx}" cy="${cy}" r="${(re+ri)/2}" fill="none" stroke="var(--sunken)" stroke-width="${re-ri}"/>`;
  }else{
    const gap=0.02, vis=itens.filter(x=>x.valor>0);
    let a=0; corpo="";
    vis.forEach((it,i)=>{
      const frac=it.valor/total, a1=a+frac*TAU;
      const tit=`<title>${esc(it.nome)}: ${money(it.valor)} (${Math.round(frac*100)}%)</title>`;
      if(frac>=0.9995){
        corpo+=`<circle cx="${cx}" cy="${cy}" r="${(re+ri)/2}" fill="none" stroke="${it.cor}"
          stroke-width="${re-ri}" data-fatia="${i}">${tit}</circle>`;
      }else{
        const aa=vis.length>1?a+gap/2:a, bb=vis.length>1?a1-gap/2:a1;
        if(bb>aa) corpo+=`<path d="${arco(cx,cy,re,ri,aa,bb)}" fill="${it.cor}" data-fatia="${i}">${tit}</path>`;
      }
      a=a1;
    });
  }
  /* anel interno: quanto do gasto foi na conta (verde) e quanto no cartão (violeta) */
  if(total&&split&&split.cartao>0){
    const fc=split.conta/(split.conta+split.cartao), g2=split.conta>0?0.03:0;
    if(split.conta>0) corpo+=`<path d="${arco(cx,cy,68,62,g2/2,fc*TAU-g2/2)}" fill="var(--accent-ink)"><title>Conta: ${money(split.conta)}</title></path>`;
    corpo+=fc<=0?`<circle cx="${cx}" cy="${cy}" r="65" fill="none" stroke="var(--cred)" stroke-width="6"/>`
      :`<path d="${arco(cx,cy,68,62,fc*TAU+g2/2,TAU-g2/2)}" fill="var(--cred)"><title>Cartão: ${money(split.cartao)}</title></path>`;
  }
  return `<svg viewBox="0 0 ${W} ${W}" width="100%" style="max-width:214px;display:block;margin:0 auto"
    role="img" aria-label="Gastos do mês por categoria: ${money(total)}">${corpo}
    <text x="${cx}" y="${cy-20}" text-anchor="middle" fill="var(--ink-faint)" font-size="9.5"
      letter-spacing="1.5" font-family="var(--mo)">SAIU NO MÊS</text>
    <text x="${cx}" y="${cy+8}" text-anchor="middle" fill="var(--ink)" font-size="23" font-weight="700"
      letter-spacing="-.5" font-family="var(--ui)">${esc(moneyShort(total))}</text>
    ${pcEnt!==null?`<text x="${cx}" y="${cy+30}" text-anchor="middle" fill="${pcEnt>100?"var(--warn)":"var(--ink-faint)"}"
      font-size="10" font-family="var(--mo)">${pcEnt}% DO QUE ENTROU</text>`:""}
  </svg>`;
}

/* Os gráficos são desenhados na largura da tela, não numa tira que rola.
   Quando há meses demais para caber, o que rareia são os rótulos — nunca os dados. */
const CW=364;
const rotulos=(labels,passo)=>labels.map((l,i)=>(i%passo===0||i===labels.length-1)?l:"");

/* barras agrupadas — entradas x saídas por mês */
function barrasDuplas(series,labels){
  const W=CW,H=196,ml=40,mr=6,mt=12,mb=24;
  const iw=W-ml-mr, ih=H-mt-mb;
  const max=Math.max(1,...series.flatMap(s=>s.dados));
  const passo=Math.ceil(max/3/100)*100||1;
  const topo=Math.max(passo*3,max);
  const bw=iw/labels.length;
  const larg=Math.max(3,Math.min(11,(bw-5)/2));
  const saltoRot=labels.length>8?2:1;
  const rots=rotulos(labels,saltoRot);
  let g="",b="";
  for(let k=0;k<=3;k++){
    const y=mt+ih-(passo*k/topo)*ih;
    g+=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${ml-6}" y="${y+3.5}" text-anchor="end" fill="var(--ink-faint)" font-size="8.5"
      font-family="var(--mo)">${eixo(passo*k)}</text>`;
  }
  labels.forEach((lb,i)=>{
    const x0=ml+bw*i+bw/2;
    series.forEach((s,j)=>{
      const v=s.dados[i]||0, h=v>0?Math.max(2.5,(v/topo)*ih):0;
      const x=x0+(j===0?-larg-0.8:0.8);
      if(h>0) b+=`<rect x="${x}" y="${mt+ih-h}" width="${larg}" height="${h}" rx="3" ry="3" fill="${s.cor}"
        ><title>${esc(lb)} · ${esc(s.nome)}: ${money(v)}</title></rect>`;
    });
    if(rots[i]) b+=`<text x="${x0}" y="${H-7}" text-anchor="middle" fill="var(--ink-faint)" font-size="8.5"
      font-family="var(--mo)">${esc(rots[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entradas e saídas por mês">${g}
    <line x1="${ml}" y1="${mt+ih}" x2="${W-mr}" y2="${mt+ih}" stroke="var(--line-strong)" stroke-width="1"/>${b}</svg>`;
}

/* linha de saldo acumulado */
function linha(dados,labels,cor){
  const W=CW,H=176,ml=40,mr=10,mt=14,mb=24;
  const iw=W-ml-mr, ih=H-mt-mb;
  const min=Math.min(0,...dados), max=Math.max(1,...dados);
  const span=(max-min)||1;
  const X=i=>ml+(dados.length>1?iw*i/(dados.length-1):iw/2);
  const Y=v=>mt+ih-((v-min)/span)*ih;
  const saltoRot=labels.length>8?3:2;
  const rots=rotulos(labels,saltoRot);
  let g="";
  for(let k=0;k<=3;k++){
    const v=min+span*k/3, y=Y(v);
    g+=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${ml-6}" y="${y+3.5}" text-anchor="end" fill="var(--ink-faint)" font-size="8.5"
      font-family="var(--mo)">${eixo(v)}</text>`;
  }
  const pts=dados.map((v,i)=>`${X(i)} ${Y(v)}`).join("L");
  const area=`M${X(0)} ${Y(min)}L${pts}L${X(dados.length-1)} ${Y(min)}Z`;
  let marks="";
  dados.forEach((v,i)=>{
    const ult=i===dados.length-1;
    marks+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${ult?4.5:2.8}" fill="${ult?cor:"var(--surface)"}" stroke="${cor}"
      stroke-width="1.8"><title>${esc(labels[i])}: ${money(v)}</title></circle>`;
    if(rots[i]) marks+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle" fill="var(--ink-faint)"
      font-size="8.5" font-family="var(--mo)">${esc(rots[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Saldo acumulado">${g}
    <path d="${area}" fill="${cor}" opacity=".12"/>
    <path d="M${pts}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks}</svg>`;
}

/* barras empilhadas — categorias ao longo dos meses */
function empilhado(meses,labels,cats){
  const W=CW,H=196,ml=40,mr=6,mt=12,mb=24;
  const iw=W-ml-mr, ih=H-mt-mb;
  const totais=meses.map(m=>cats.reduce((a,c)=>a+(m[c.id]||0),0));
  const max=Math.max(1,...totais);
  const passo=Math.ceil(max/3/100)*100||1, topo=Math.max(passo*3,max);
  const bw=iw/labels.length, larg=Math.min(22,bw-8);
  const rots=rotulos(labels,labels.length>8?2:1);
  let g="",b="";
  for(let k=0;k<=3;k++){
    const y=mt+ih-(passo*k/topo)*ih;
    g+=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${ml-6}" y="${y+3.5}" text-anchor="end" fill="var(--ink-faint)" font-size="8.5"
      font-family="var(--mo)">${eixo(passo*k)}</text>`;
  }
  labels.forEach((lb,i)=>{
    const x=ml+bw*i+(bw-larg)/2;
    let acc=0;
    cats.forEach(c=>{
      const v=meses[i][c.id]||0; if(v<=0) return;
      const h=(v/topo)*ih, y=mt+ih-((acc+v)/topo)*ih;
      b+=`<rect x="${x}" y="${y}" width="${larg}" height="${Math.max(1.5,h-2)}" rx="2.5" ry="2.5" fill="${c.cor}"
        ><title>${esc(lb)} · ${esc(c.nome)}: ${money(v)}</title></rect>`;
      acc+=v;
    });
    if(rots[i]) b+=`<text x="${x+larg/2}" y="${H-7}" text-anchor="middle" fill="var(--ink-faint)" font-size="8.5"
      font-family="var(--mo)">${esc(rots[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto por categoria ao longo dos meses">${g}
    <line x1="${ml}" y1="${mt+ih}" x2="${W-mr}" y2="${mt+ih}" stroke="var(--line-strong)" stroke-width="1"/>${b}</svg>`;
}
function legenda(itens,total){
  return `<div class="leg">`+itens.map(it=>`<div class="legitem">

}

/* ---------- orçamento ---------- */
/* Forma de pagamento de uma despesa: no cartão é crédito; em conta corrente,
   poupança ou carteira (débito, Pix, dinheiro) é débito. Não é guardada no
   lançamento — sai da conta, então trocar a conta troca a forma. */
const formaDe=t=>conta(t.contaId)?.tipo==="cartao"?"credito":"debito";
/* Um orçamento sem `forma` é geral: vale para qualquer forma de pagamento.
   Com forma "credito", só conta o que foi pago no cartão — pela data da compra,
   como o resto do app (cada parcela conta no mês dela). */
const formaOrc=o=>o.forma||"geral";
const ROTULO_FORMA={geral:"",credito:" no crédito",debito:" no débito"};
function gastoCategoria(catId,p,forma){
  return r2(vivas().filter(t=>t.tipo==="despesa"&&t.categoriaId===catId&&dentro(t.data,p)
    &&(!forma||forma==="geral"||formaDe(t)===forma))
    .reduce((a,t)=>a+t.valor,0));
}
const orcamentosDe=(ref,forma)=>(S.orcamentos||[]).filter(o=>o.mesRef===ref&&o.valor>0&&formaOrc(o)===(forma||"geral"));
const tetoDe=(catId,ref,forma)=>((S.orcamentos||[]).find(o=>o.categoriaId===catId&&o.mesRef===ref
  &&formaOrc(o)===(forma||"geral"))||{}).valor||0;
function estourados(p){
  return (S.orcamentos||[]).filter(o=>o.mesRef===p.ref&&o.valor>0).map(o=>{
    const c=cat(o.categoriaId); if(!c) return null;
    const f=formaOrc(o), g=gastoCategoria(o.categoriaId,p,f);
    return g>o.valor?{id:o.categoriaId+(f==="geral"?"":":"+f),nome:c.nome+ROTULO_FORMA[f],
      gasto:g,teto:o.valor,pc:Math.round(g/o.valor*100)}:null;
  }).filter(Boolean).sort((a,b)=>b.pc-a.pc);
}

/* ---------- período em linguagem de gente ---------- */
function porDia(p,disp){
  const h=new Date(); h.setHours(0,0,0,0);
  if(p.fim<h) return "mês fechado";
  if(p.ini>h) return "previsto · nada lançado ainda";
  const dias=Math.max(1,Math.round((p.fim-h)/86400000)+1);
  if(disp<0) return "você já passou do que entrou este mês";
  return money(r2(disp/dias))+" por dia nos "+dias+" dias restantes";
}

/* ---------- RESUMO ---------- */
function gastosPorCategoria(p,inst){
  const m=new Map();
  vivas().filter(t=>t.tipo==="despesa"&&dentro(t.data,p)&&txDaInst(t,inst)).forEach(t=>
    m.set(t.categoriaId,r2((m.get(t.categoriaId)||0)+t.valor)));
  return [...m.entries()].map(([id,valor])=>{const c=cat(id);
    return {id,nome:c?c.nome:"Sem categoria",icone:c?c.icone:"•",valor,cor:catCor(c)};})
    .sort((a,b)=>b.valor-a.valor);
}

/* Com mais categorias do que tons, duas podem cair na mesma cor. Aqui, entre as
   que estão de fato na tela, cada uma recebe um tom distinto — percorrendo a
   ordem global das categorias, não a ordem do ranking, para a cor de uma
   categoria não dançar a cada mês. */
function distinguir(itens){
  const ids=itens.filter(x=>x.id).map(x=>x.id);
  const usados=new Set(), mapa=new Map();
  S.categorias.forEach(c=>{
    if(!ids.includes(c.id)) return;
    if(c.tipo==="receita"){ mapa.set(c.id,corSerie("entra")); return; }
    let sl=c.slot!=null?c.slot:0;
    if(usados.has(sl)) for(let k=1;k<NSLOT;k++){ const t=(sl+k)%NSLOT; if(!usados.has(t)){ sl=t; break; } }
    usados.add(sl); mapa.set(c.id,slotCor(sl));
  });
  return itens.map(x=>x.id&&mapa.has(x.id)?{...x,cor:mapa.get(x.id)}:x);
}
function saldoAte(ate,inst){
  let s=0;
  contasPag().filter(c=>contaNaInst(c.id,inst)).forEach(c=>s+=c.saldoInicial||0);
  vivas().forEach(t=>{
    if(t.data>ate||ehPrevisto(t)) return;
    const co=conta(t.contaId), cd=t.contaDestinoId?conta(t.contaDestinoId):null;
    const oIn=contaNaInst(t.contaId,inst)&&co&&co.tipo!=="cartao";
    const dIn=cd&&contaNaInst(t.contaDestinoId,inst)&&cd.tipo!=="cartao";
    if(t.tipo==="receita"&&oIn) s+=t.valor;
    else if(t.tipo==="despesa"&&oIn) s-=t.valor;
    else if(t.tipo==="transferencia"){ if(oIn) s-=t.valor; if(dIn) s+=t.valor; }
    else if(t.tipo==="pagfatura"&&oIn) s-=t.valor;
  });
  return r2(s);
}
function serieMeses(n,inst){
  const out=[];
  for(let k=n-1;k>=0;k--){
    const p=periodo(-k);
    const ts=vivas().filter(t=>dentro(t.data,p)&&txDaInst(t,inst));
    const porCat={};
    ts.filter(t=>t.tipo==="despesa").forEach(t=>porCat[t.categoriaId]=r2((porCat[t.categoriaId]||0)+t.valor));
    out.push({p,rot:MESES[p.ini.getMonth()].slice(0,3),
      entra:r2(ts.filter(t=>t.tipo==="receita").reduce((a,t)=>a+t.valor,0)),
      sai:r2(ts.filter(t=>t.tipo==="despesa").reduce((a,t)=>a+t.valor,0)),
      saldo:saldoAte(iso(p.fim),inst),porCat});
  }
  return out;
}
